# Search & Replace Paths — filter configuration
# The extensions and ignore lists below are loaded into the UI fields
# on startup. You can still edit the values in the GUI afterwards.

# File extensions to scan (leave empty list [] to scan all files)
extensions:
  - ".py"
  - ".json"
  - ".ps1"
  - ".md"
  - ".bat"
  - ".txt"
  - ".ini"
  - ".cfg"
  - ".conf"
  - ".yaml"
  - ".yml"
  - ".xml"
  - ".sh"
  - ".cmd"
  - ".ahk"

# Folder names to skip while walking the directory tree
ignore:
  - ".git"
  - "node_modules"
  - "__pycache__"
  - "venv"
  - ".venv"
  - ".uv-envs"
  - "env"
  - "build"
  - "dist"
  - "out"
  - "bin"
  - "obj"
  - ".idea"
  - ".vscode"
  - ".vs"
  - ".mypy_cache"
  - ".pytest_cache"
