<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Runner - 2D Platformer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hint">
    <b>A / D</b> move &nbsp;·&nbsp; <b>W / Space</b> jump (double-jump) &nbsp;·&nbsp;
    <b>Shift</b> dash &nbsp;·&nbsp; <b>Mouse</b> aim &amp; hold to shoot &nbsp;·&nbsp;
    <b>Q</b> or <b>1 2 3</b> weapon &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>R</b> restart
  </div>

  <script src="game.js"></script>
</body>
</html>
