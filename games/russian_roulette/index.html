<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Roulette</title>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --red:#e74c3c;--gold:#f0b429;--green:#2ecc71;
            --bg:#07090c;--card:#0d1520;--card2:#111d2a;
            --border:#192536;--b2:#1e2e42;--text:#c0d0e0;--dim:#364d63;
        }
        html,body{height:100%;overflow:hidden}
        body{
            background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
            min-height:100vh;position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background-image:linear-gradient(rgba(231,76,60,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(231,76,60,.02) 1px,transparent 1px);
            background-size:48px 48px;pointer-events:none;z-index:0;
        }
        body::after{
            content:'';position:fixed;inset:0;
            background:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(231,76,60,.06) 0%,transparent 65%);
            pointer-events:none;z-index:0;
        }
        #particles{position:fixed;inset:0;pointer-events:none;z-index:1}
        #bloodOverlay{
            position:fixed;inset:0;
            background:radial-gradient(ellipse at center,transparent 20%,rgba(130,5,5,.97) 100%);
            opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:200;
        }
        #bloodOverlay.active{opacity:1}
        #flashOverlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:202;transition:opacity .04s}

        /* ── Two-column layout ── */
        .layout{
            position:relative;z-index:10;
            display:flex;flex-direction:row;align-items:center;
            width:100vw;height:100vh;
        }

        /* LEFT / CENTER — gun takes all remaining space */
        .gun-col{
            flex:1 1 0;
            display:flex;align-items:stretch;justify-content:stretch;
            height:100%;
            position:relative;
            overflow:hidden;
        }

        /* RIGHT PANEL */
        .ui-col{
            flex:0 0 320px;
            display:flex;flex-direction:column;
            justify-content:center;
            align-items:stretch;
            height:100%;
            padding:24px 28px 24px 8px;
            gap:14px;
        }

        .title{
            font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,3.2vw,2.8rem);
            letter-spacing:8px;color:var(--red);
            text-shadow:0 0 40px rgba(231,76,60,.6),0 0 80px rgba(231,76,60,.15);
            line-height:1;user-select:none;
        }
        .tagline{font-size:.60rem;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-top:2px}

        /* ── 3D Gun wrapper — fills the whole gun column ── */
        #gunWrap{
            position:relative;
            width:100%;
            height:100%;
            flex:1;
        }
        #threeContainer{
            position:absolute;
            inset:0;
            width:100% !important;
            height:100% !important;
        }
        #gunWrap.recoil {animation:recoil  .35s cubic-bezier(.1,.7,.3,1) forwards}
        #gunWrap.dryfire{animation:dryfire .18s ease-out forwards}
        @keyframes recoil{
            0%  {transform:translate(0,0) scale(1) rotate(0deg)}
            20% {transform:translate(0px,14px) scale(.97) rotate(1deg)}
            50% {transform:translate(0px,-6px) scale(1.01) rotate(-.5deg)}
            100%{transform:translate(0,0) scale(1) rotate(0deg)}
        }
        @keyframes dryfire{
            0%  {transform:translate(0,0) scale(1)}
            50% {transform:translate(0,4px) scale(.99)}
            100%{transform:translate(0,0) scale(1)}
        }

        /* Muzzle flash — at barrel muzzle position in the 3/4 view (front-left area) */
        #muzzleFlash{
            position:absolute;left:34%;top:46%;
            transform:translate(-50%,-50%);
            width:0;height:0;border-radius:50%;pointer-events:none;opacity:0;z-index:20;
        }
        #muzzleFlash.bang{animation:muzzBang .28s ease-out forwards}
        @keyframes muzzBang{
            0%  {opacity:1;width:0;height:0;box-shadow:0 0 0 0 #fff,0 0 0 0 #ffe066,0 0 0 0 rgba(231,76,60,.9)}
            30% {opacity:1;width:120px;height:120px;margin:-60px;box-shadow:0 0 50px 18px #fff,0 0 90px 36px #ffe066,0 0 140px 50px rgba(231,76,60,.6)}
            100%{opacity:0;width:160px;height:160px;margin:-80px;box-shadow:0 0 0 0 transparent,0 0 0 0 transparent,0 0 0 0 transparent}
        }
        #smokeEl{
            position:absolute;left:34%;top:46%;transform:translate(-50%,-50%);
            width:12px;height:12px;border-radius:50%;background:rgba(180,200,220,.5);
            filter:blur(6px);opacity:0;pointer-events:none;z-index:19;
        }
        #smokeEl.puff{animation:smokeDrift 1.4s ease-out forwards}
        @keyframes smokeDrift{
            0%  {opacity:.6;transform:translate(-50%,-50%) scale(1)}
            100%{opacity:0;transform:translate(-50%,-130px) scale(7)}
        }

        #threeCanvas{
            width:100%!important;height:100%!important;
            display:block;
        }

        /* ── Card ── */
        .card{
            background:var(--card);border:1px solid var(--border);border-radius:20px;
            padding:20px 20px 16px;width:100%;
            box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.04);
            display:flex;flex-direction:column;align-items:center;gap:14px;
        }
        .card.shake{animation:shake .45s ease}
        .card.sglow {animation:sglow  .8s ease}
        @keyframes shake{
            0%,100%{transform:translate(0,0)}
            15%{transform:translate(-7px,3px)}30%{transform:translate(7px,-3px)}
            50%{transform:translate(-5px,4px)}70%{transform:translate(5px,-3px)}85%{transform:translate(-3px,2px)}
        }
        @keyframes sglow{
            0%,100%{box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.04)}
            45%    {box-shadow:0 20px 60px rgba(0,0,0,.75),0 0 40px rgba(46,204,113,.2),inset 0 1px 0 rgba(255,255,255,.04)}
        }
        .divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--b2) 30%,var(--b2) 70%,transparent)}
        .status{
            height:28px;display:flex;align-items:center;justify-content:center;
            font-size:.86rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
            color:var(--gold);text-shadow:0 0 12px rgba(240,180,41,.3);transition:color .3s,text-shadow .3s;
        }
        .status.danger{color:var(--red);text-shadow:0 0 18px rgba(231,76,60,.65);animation:pulseRed .45s infinite alternate}
        .status.safe  {color:var(--green);text-shadow:0 0 14px rgba(46,204,113,.5)}
        .status.idle  {color:var(--dim);text-shadow:none}
        @keyframes pulseRed{to{opacity:.5}}
        .btn-group{display:flex;gap:12px;width:100%}
        .btn{
            flex:1;padding:14px 10px;font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:2px;
            border:1px solid transparent;border-radius:10px;cursor:pointer;
            transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;color:#fff;
        }
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,transparent 55%);border-radius:inherit;pointer-events:none}
        .btn-spin{
            background:linear-gradient(170deg,#1d7db8,#1a5f8c 55%,#153f60);
            border-color:rgba(52,152,219,.25);box-shadow:0 4px 16px rgba(25,80,120,.55),inset 0 1px 0 rgba(255,255,255,.09);
        }
        .btn-spin:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 22px rgba(52,152,219,.4),inset 0 1px 0 rgba(255,255,255,.09)}
        .btn-shoot{
            background:linear-gradient(170deg,#bf3a2a,#962020 55%,#6e1515);
            border-color:rgba(192,57,43,.3);box-shadow:0 4px 16px rgba(140,30,20,.55),inset 0 1px 0 rgba(255,255,255,.07);
        }
        .btn-shoot:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 22px rgba(231,76,60,.45),inset 0 1px 0 rgba(255,255,255,.07)}
        .btn:active:not(:disabled){transform:translateY(1px)!important}
        .btn:disabled{background:rgba(255,255,255,.035)!important;border-color:var(--border)!important;color:var(--dim)!important;box-shadow:none!important;transform:none!important;cursor:not-allowed}
        .bottom{width:100%;display:flex;flex-direction:column;gap:12px}
        .odds-row{width:100%;display:flex;flex-direction:column;gap:5px}
        .odds-header{display:flex;justify-content:space-between;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
        .odds-val{font-family:'Bebas Neue',sans-serif;font-size:.82rem;color:var(--text)}
        .odds-track{width:100%;height:5px;background:rgba(255,255,255,.04);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
        .odds-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold) 65%,var(--red));border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);width:83.33%}
        .stats{display:flex;gap:9px;justify-content:center}
        .stat-pill{background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:6px 15px;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--dim)}
        .sval{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--text)}
        .history{display:flex;gap:5px;justify-content:center;min-height:11px}
        .hdot{width:9px;height:9px;border-radius:50%;background:var(--b2)}
        .hdot.s{background:var(--green);box-shadow:0 0 5px rgba(46,204,113,.6)}
        .hdot.d{background:var(--red);  box-shadow:0 0 5px rgba(231,76,60,.6)}
        .hdot.new{animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
        @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

        /* ── Background color picker ── */
        #bgPickerBtn{
            position:fixed;bottom:18px;left:18px;z-index:300;
            display:flex;align-items:center;gap:8px;
            background:rgba(13,21,32,.85);border:1px solid var(--border);
            border-radius:99px;padding:6px 12px 6px 8px;
            cursor:pointer;backdrop-filter:blur(8px);
            font-size:.68rem;letter-spacing:2px;text-transform:uppercase;
            color:var(--dim);transition:border-color .2s,color .2s;
            user-select:none;
        }
        #bgPickerBtn:hover{border-color:var(--text);color:var(--text)}
        #bgSwatch{
            width:16px;height:16px;border-radius:50%;
            background:#07090c;border:1.5px solid rgba(255,255,255,.15);
            flex-shrink:0;transition:background .2s;
        }
        /* hide the native color input but keep it clickable */
        #bgColorInput{
            position:absolute;width:0;height:0;opacity:0;pointer-events:none;
        }
        /* preset swatches panel */
        #bgPresets{
            position:fixed;bottom:56px;left:18px;z-index:301;
            display:none;flex-wrap:wrap;gap:7px;
            background:rgba(13,21,32,.92);border:1px solid var(--border);
            border-radius:14px;padding:12px;
            backdrop-filter:blur(10px);
            width:192px;
        }
        #bgPresets.open{display:flex}
        .bgp{
            width:28px;height:28px;border-radius:50%;cursor:pointer;
            border:2px solid transparent;transition:transform .12s,border-color .15s;
        }
        .bgp:hover{transform:scale(1.18);border-color:rgba(255,255,255,.4)}
        #bgCustomRow{
            width:100%;display:flex;align-items:center;gap:8px;
            padding-top:6px;border-top:1px solid var(--border);margin-top:2px;
        }
        #bgCustomRow label{font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);flex:1}
        #bgColorInput2{
            width:32px;height:24px;border:none;padding:0;background:none;cursor:pointer;border-radius:4px;
        }
    </style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="bloodOverlay"></div>
<div id="flashOverlay"></div>

<div class="layout">
    <!-- LEFT: 3D Gun (fills most of the screen) -->
    <div class="gun-col">
        <div id="gunWrap">
            <div id="muzzleFlash"></div>
            <div id="smokeEl"></div>
            <div id="threeContainer"></div>
        </div>
    </div>

    <!-- RIGHT: Title + all game UI -->
    <div class="ui-col">
        <div>
            <div class="title">RUSSIAN<br>ROULETTE</div>
            <div class="tagline">How lucky are you?</div>
        </div>

        <div class="card" id="card">
            <div class="status idle" id="statusEl">SPIN TO BEGIN</div>
            <div class="btn-group">
                <button class="btn btn-spin"  id="spinBtn">⟳  SPIN</button>
                <button class="btn btn-shoot" id="shootBtn" disabled>FIRE  🔫</button>
            </div>
            <div class="divider"></div>
            <div class="bottom">
                <div class="odds-row">
                    <div class="odds-header">
                        <span>Survival Odds</span>
                        <span class="odds-val" id="oddsVal">5 in 6</span>
                    </div>
                    <div class="odds-track"><div class="odds-fill" id="oddsFill"></div></div>
                </div>
                <div class="stats">
                    <div class="stat-pill">💀 <span class="sval" id="svCount">0</span></div>
                    <div class="stat-pill">🔄 <span class="sval" id="spCount">0</span></div>
                    <div class="stat-pill">🔥 <span class="sval" id="stCount">0</span></div>
                </div>
                <div class="history" id="history"></div>
            </div>
        </div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   THREE.JS 3D REVOLVER
   Camera: looking straight down the barrel (front-facing view).
   The gun points toward the camera — barrel axis along +Z.
   Camera sits at Z+ looking toward Z- (into the muzzle).
═══════════════════════════════════════════════════════════════ */

const threeContainer = document.getElementById('threeContainer');

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
scene.fog = new THREE.FogExp2(0x07090c, 0.032);

// Renderer — fills the gunWrap container, sized dynamically
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.domElement.id = 'threeCanvas';
threeContainer.appendChild(renderer.domElement);

// Size renderer to fill its container
function resizeRenderer() {
    const w = threeContainer.clientWidth;
    const h = threeContainer.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (typeof controls !== 'undefined') controls.update();
}

// Camera — proper 3/4 view from file.txt, slightly tweaked for the layout
// Gun sits at origin. Camera above-right-front looking down at the cylinder.
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
// Position: front-right, elevated — shows barrel going left, cylinder facing viewer
// Based on file.txt: camera.position.set(3.4, 1.4, 3.8)
// Tweaked: pull back a bit more so full gun is visible
camera.position.set(4.2, 2.0, 4.8);
camera.lookAt(0, 0.1, -0.8);

// OrbitControls — left drag: orbit, scroll: zoom, right drag: pan
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.05, -0.8);
controls.minDistance = 2.5;
controls.maxDistance = 12;

// Lock vertical angle: prevents top-down and upside-down views
// PI * 0.18 = ~32° from top (gentle high angle)
// PI * 0.62 = ~112° (slightly below level — shows underside of barrel)
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.62;
controls.update();

/* ═══════════════════════════════════
   LIGHTING
   Key from upper-left, fill from right,
   rim from behind — matches 3/4 camera position
═══════════════════════════════════ */
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

// Key — upper-left, like the reference photo
const keyLight = new THREE.DirectionalLight(0xd0e8ff, 3.2);
keyLight.position.set(-3, 6, 4);
keyLight.castShadow = true;
scene.add(keyLight);

// Fill — right side, warmer
const fillLight = new THREE.DirectionalLight(0xffd8a0, 1.2);
fillLight.position.set(4, 1, 3);
scene.add(fillLight);

// Rim — from behind the gun (Z-), rim-lights the silhouette edges
const rimLight = new THREE.DirectionalLight(0x6090c0, 1.8);
rimLight.position.set(0, 3, -6);
scene.add(rimLight);

// Muzzle flash point light (activated on BANG)
const flashLight = new THREE.PointLight(0xff8800, 0, 6);
flashLight.position.set(0, 0.42, 2.8);
scene.add(flashLight);

/* ── MATERIALS ── */
// Blued steel frame
const matFrame = new THREE.MeshStandardMaterial({
    color: 0x1a2230, metalness: 0.92, roughness: 0.30,
});
// Cylinder — slightly lighter, higher contrast to show chambers
const matCyl = new THREE.MeshStandardMaterial({
    color: 0x384858, metalness: 0.96, roughness: 0.18,
});
// Dark recesses / bore
const matDark = new THREE.MeshStandardMaterial({
    color: 0x080c12, metalness: 0.7, roughness: 0.6,
});
// Brass cartridge
const matBrass = new THREE.MeshStandardMaterial({
    color: 0xc49020, metalness: 0.98, roughness: 0.15,
});
// Bullet primer (silver)
const matPrimer = new THREE.MeshStandardMaterial({
    color: 0x8090a0, metalness: 0.95, roughness: 0.25,
});
// Wood grip
const matWood = new THREE.MeshStandardMaterial({
    color: 0x3a1808, roughness: 0.70, metalness: 0.04,
});
// Muzzle flash cone
const matFlash = new THREE.MeshBasicMaterial({
    color: 0xffe080, transparent: true, opacity: 0,
});

/* ── GUN ROOT GROUP ── */
const gunRoot = new THREE.Group();
scene.add(gunRoot);

/*
  COORDINATE SYSTEM (all in gunRoot local space):
  - Gun points LEFT in world space (barrel along -Z)
  - Y = up
  - X = toward camera (right side of gun faces camera)

  Key reference points (matching S&W K-frame proportions):
  - Cylinder center:   Y=0,    Z=0
  - Barrel axis:       Y=0.42, Z along -Z  (top chamber alignment)
  - Frame rear:        Z=+0.78
  - Frame front:       Z=-0.90
  - Grip pivot:        Y=-0.58, Z=+0.55
*/

const CYL_Y   = 0;       // cylinder center Y
const CYL_R   = 0.60;    // cylinder radius
const BAR_Y   = 0.42;    // barrel axis Y (top chamber)
const FRAME_W = 0.38;    // frame half-width (X)

/* ═══════════════════════════════════════
   1. MAIN FRAME BODY
   Shaped like a revolver frame: wide at cylinder,
   narrows toward barrel, has grip tang below.
   Built from several overlapping boxes.
═══════════════════════════════════════ */

// Main body slab — the receiver around the cylinder window
const frameBody = new THREE.Mesh(
    new THREE.BoxGeometry(FRAME_W, 1.35, 1.72), matFrame);
frameBody.position.set(0, 0.02, -0.05);
gunRoot.add(frameBody);

// Top strap — runs from rear frame to barrel junction, above cylinder
// Sits just above barrel: top of cylinder = CYL_Y + CYL_R = 0.60
// Top strap bottom edge at 0.62, center at 0.62+0.08=0.70
const topStrap = new THREE.Mesh(
    new THREE.BoxGeometry(FRAME_W - 0.02, 0.16, 1.72), matFrame);
topStrap.position.set(0, 0.70, -0.05);
gunRoot.add(topStrap);

// Barrel-to-frame transition lug (thickening where barrel meets frame front)
const barrelLug = new THREE.Mesh(
    new THREE.BoxGeometry(FRAME_W, 0.72, 0.32), matFrame);
barrelLug.position.set(0, BAR_Y - 0.04, -0.88);
gunRoot.add(barrelLug);

// Rear frame / recoil shield (thick plate behind cylinder)
const recoilShield = new THREE.Mesh(
    new THREE.BoxGeometry(FRAME_W + 0.06, 1.30, 0.36), matFrame);
recoilShield.position.set(0, 0.02, 0.76);
gunRoot.add(recoilShield);

// Rear sight housing on top of recoil shield
const rearSight = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.10, 0.20), matFrame);
rearSight.position.set(0, 0.82, 0.65);
gunRoot.add(rearSight);

/* ═══════════════════════════════════════
   2. BARREL
   Cylinder along Z, axis at BAR_Y.
   4" barrel (matching reference photo proportions).
═══════════════════════════════════════ */
const BARREL_LEN = 2.8;
const barrelZ    = -0.90 - BARREL_LEN / 2;
const BARREL_Y   = BAR_Y;
const muzzleZ    = -0.90 - BARREL_LEN;

const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.21, 0.22, BARREL_LEN, 24), matFrame);
barrel.rotation.x = Math.PI / 2;
barrel.position.set(0, BARREL_Y, barrelZ);
gunRoot.add(barrel);

// Underlug / full-lug shroud below barrel (S&W style)
const underlug = new THREE.Mesh(
    new THREE.CylinderGeometry(0.185, 0.195, BARREL_LEN, 16), matFrame);
underlug.rotation.x = Math.PI / 2;
underlug.position.set(0, BARREL_Y - 0.26, barrelZ);
gunRoot.add(underlug);

// Ejector rod inside underlug
const ejectorRod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, BARREL_LEN - 0.3, 10), matCyl);
ejectorRod.rotation.x = Math.PI / 2;
ejectorRod.position.set(0, BARREL_Y - 0.26, barrelZ + 0.15);
gunRoot.add(ejectorRod);

// Muzzle face ring
const muzzleCrown = new THREE.Mesh(
    new THREE.TorusGeometry(0.21, 0.022, 10, 28), matCyl);
muzzleCrown.rotation.x = Math.PI / 2;
muzzleCrown.position.set(0, BARREL_Y, muzzleZ);
gunRoot.add(muzzleCrown);

// Bore opening
const muzzleBore = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.12, 0.10, 18), matDark);
muzzleBore.rotation.x = Math.PI / 2;
muzzleBore.position.set(0, BARREL_Y, muzzleZ - 0.02);
gunRoot.add(muzzleBore);

// Front sight (ramp style — tapers toward muzzle)
const frontSight = new THREE.Mesh(
    new THREE.BoxGeometry(0.055, 0.14, 0.22), matFrame);
frontSight.position.set(0, BARREL_Y + 0.185, muzzleZ + 0.16);
gunRoot.add(frontSight);

function renderLoop() {

    animState.recoilRot += (0 - animState.recoilRot) * 14 * delta;

    gunRoot.rotation.x = animState.recoilRot;

/* ═══════════════════════════════════
   3D ANIMATION HELPERS
═══════════════════════════════════ */

// Animate cylinder spinning: fast spin then settle to a specific final rotation
function animCylSpin(totalExtraRot, duration, onDone) {
    const start = performance.now();
    const startRot = cylinderGroup.rotation.z;
    const endRot = startRot + totalExtraRot;

    function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        // Ease: fast start, slow deceleration (like spinning and slowing)
        const e = 1 - Math.pow(1 - p, 3);
        cylinderGroup.rotation.z = startRot + (endRot - startRot) * e;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            cylinderGroup.rotation.z = endRot;
            if (onDone) onDone();
        }
    }
    requestAnimationFrame(tick);
}

// Trigger pull animation: pull back → release → reset
function animTriggerPull(onFire) {
    const start = performance.now();
    const pullDur = 200;
    const startRot = triggerPivot.rotation.x;

    function tick(now) {
        const p = Math.min((now - start) / pullDur, 1);
        const s = p * p * (3 - 2 * p);
        triggerPivot.rotation.x = startRot - s * 0.45;
        hammerPivot.rotation.x  = -s * 0.80;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            // Fire!
            hammerPivot.rotation.x = 0.15; // snap forward
            triggerPivot.rotation.x = 0;
            if (onFire) onFire();
            // Reset hammer
            setTimeout(() => { hammerPivot.rotation.x = 0; }, 180);
        }
    }
    requestAnimationFrame(tick);
}

// Trigger dry-fire: smaller motion
function animDryfire(onDone) {
    const start = performance.now();
    function tick(now) {
        const p = Math.min((now - start) / 140, 1);
        const s = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
        triggerPivot.rotation.x = -s * 0.22;
        hammerPivot.rotation.x  = -s * 0.35;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            triggerPivot.rotation.x = 0;
            hammerPivot.rotation.x  = 0;
            if (onDone) onDone();
        }
    }
    requestAnimationFrame(tick);
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════════ */
const AC = new (window.AudioContext || window.webkitAudioContext)();
const resumeAC = () => { if (AC.state === 'suspended') AC.resume(); };

const playRatchet = () => {
    resumeAC(); const t = AC.currentTime;
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(1400 + Math.random()*200, t);
    o.frequency.exponentialRampToValueAtTime(350, t+.025);
    f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 5;
    g.gain.setValueAtTime(.25, t); g.gain.linearRampToValueAtTime(.001, t+.025);
    o.connect(f); f.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+.025);
};
const playThud = () => {
    resumeAC(); const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(48, t+.09);
    g.gain.setValueAtTime(.5, t); g.gain.linearRampToValueAtTime(.001, t+.09);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.09);
};
const playTrigger = () => {
    resumeAC(); const t = AC.currentTime;
    [[1800,400,.04,'sine',0,.38],[140,38,.07,'triangle',.03,.48]].forEach(([f1,f2,d,tp,dl,v]) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = tp;
        o.frequency.setValueAtTime(f1, t+dl);
        o.frequency.exponentialRampToValueAtTime(f2, t+dl+d);
        g.gain.setValueAtTime(v, t+dl); g.gain.linearRampToValueAtTime(.001, t+dl+d);
        o.connect(g); g.connect(AC.destination); o.start(t+dl); o.stop(t+dl+d);
    });
};
const playEmpty = () => {
    resumeAC(); const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(220, t+.06);
    g.gain.setValueAtTime(.15, t); g.gain.linearRampToValueAtTime(.001, t+.06);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.06);
};
const playBang = () => {
    resumeAC(); const t = AC.currentTime, dur = 2;
    const buf = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    const ns = AC.createBufferSource(); ns.buffer = buf;
    const fl = AC.createBiquadFilter(); fl.type='lowpass';
    fl.frequency.setValueAtTime(1100, t);
    fl.frequency.exponentialRampToValueAtTime(55, t+dur);
    const gn = AC.createGain();
    gn.gain.setValueAtTime(1, t); gn.gain.exponentialRampToValueAtTime(.001, t+dur);
    ns.connect(fl); fl.connect(gn); gn.connect(AC.destination); ns.start(t);
    const sb = AC.createOscillator(), sg = AC.createGain();
    sb.type='sine';
    sb.frequency.setValueAtTime(110, t); sb.frequency.exponentialRampToValueAtTime(28, t+.35);
    sg.gain.setValueAtTime(1, t); sg.gain.linearRampToValueAtTime(.001, t+.35);
    sb.connect(sg); sg.connect(AC.destination); sb.start(t); sb.stop(t+.35);
};

const cv = document.getElementById('particles'), ctx = cv.getContext('2d');
let W2, H2;

    W2 = cv.width = window.innerWidth;
    H2 = cv.height = window.innerHeight;

resize(); window.addEventListener('resize', resize);
const allP = [];
class Particle {
    constructor(x,y,col) {
        this.x=x; this.y=y; this.col=col;
        this.vx=(Math.random()-.5)*7; this.vy=(Math.random()-1.1)*8;
        this.r=Math.random()*4+1.5; this.life=1;
    }
    step() { this.vx*=.97; this.vy+=.16; this.x+=this.vx; this.y+=this.vy; this.life-=.02; }
    draw() {
        ctx.save(); ctx.globalAlpha=Math.max(0,this.life);
        ctx.shadowColor=this.col; ctx.shadowBlur=7;
        ctx.fillStyle=this.col; ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
}
function burst(x,y,col,n=35) { for(let i=0;i<n;i++) allP.push(new Particle(x,y,col)); }
const embers = Array.from({length:22}, () => {
    const e = { reset() {
        this.x=Math.random()*window.innerWidth; this.y=window.innerHeight+8;
        this.r=Math.random()*1.6+.3; this.vx=(Math.random()-.5)*.4;
        this.vy=-(Math.random()*.5+.2); this.alpha=Math.random()*.3+.07; this.life=1;
    }};
    e.reset(); e.y=Math.random()*window.innerHeight; return e;
});
(function pLoop() {
    ctx.clearRect(0,0,W2,H2);
    for (let i=allP.length-1;i>=0;i--) {
        allP[i].step(); allP[i].draw();
        if (allP[i].life<=0) allP.splice(i,1);
    }
    for (const e of embers) {
        e.x+=e.vx; e.y+=e.vy; e.life-=.0025;
        ctx.save(); ctx.globalAlpha=e.alpha*e.life;
        ctx.fillStyle='#e74c3c'; ctx.shadowColor='#e74c3c'; ctx.shadowBlur=5;
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill(); ctx.restore();
        if (e.life<=0) e.reset();
    }
    requestAnimationFrame(pLoop);
})();

// Smoothly reset camera to the good 3/4 view
function resetCamera() {
    const startPos = camera.position.clone();
    const endPos   = new THREE.Vector3(4.2, 2.0, 4.8);
    const startTgt = controls.target.clone();
    const endTgt   = new THREE.Vector3(0, 0.05, -0.8);
    const t0 = performance.now();
    const dur = 600;
    (function camTick(now) {
        const p = Math.min((now - t0) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3); // ease-out cubic
        camera.position.lerpVectors(startPos, endPos, e);
        controls.target.lerpVectors(startTgt, endTgt, e);
        controls.update();
        if (p < 1) requestAnimationFrame(camTick);
    })(performance.now());
}

spinBtn.addEventListener('click', () => {
    if (spinBtn.disabled) return;
    spinBtn.disabled = true;
    shootBtn.disabled = true;
    bloodOv.classList.remove('active');
    setStatus('SPINNING...', '');
    animState.isSpinning = true;

    // Snap camera back to good view so spin is visible
    resetCamera();

    bulletPos = Math.floor(Math.random()*6);

    // Total rotation: 3–5 full turns + random chamber offset
    const fullTurns = (Math.floor(Math.random()*3) + 3) * Math.PI * 2;
    const chamberOffset = Math.floor(Math.random()*6) * (Math.PI / 3);
    const totalRot = fullTurns + chamberOffset;
    const spinDur  = 1300;

    // Play ratchet clicks during spin
    let clicks = 0;
    const maxClicks = 22;
    const ratchetInterval = setInterval(() => {
        if (clicks++ < maxClicks) playRatchet();
        else clearInterval(ratchetInterval);
    }, spinDur / maxClicks);

    animCylSpin(totalRot, spinDur, () => {
        playThud();
        animState.isSpinning = false;
        currentPos = Math.round(
            ((2 * Math.PI - (cylinderGroup.rotation.z % (2 * Math.PI))) % (2 * Math.PI))
            / (Math.PI / 3)
        ) % 6;
        isSpun = true;
        spinBtn.disabled = false;
        shootBtn.disabled = false;
        setStatus('PULL THE TRIGGER', '');
        spins++;
        spCountEl.textContent = spins;
        setOdds(5, 6);
    });
});

                animGunCss('recoil');
                triggerMuzzleFlash3D();
                triggerMuzzleCSS();

                // 3D recoil
                animState.recoilRot = 0.38;
                animState.recoilZ   = 0.25;

                setTimeout(()=>{ bloodOv.classList.add('active'); }, 55);
                card.classList.add('shake');
                setTimeout(()=>card.classList.remove('shake'), 500);
                setStatus('BANG', 'danger');

                const r = card.getBoundingClientRect();
                burst(W2/2, H2/2, '#c0392b', 85);
                burst(W2/2, H2/2, '#e74c3c', 50);
                burst(W2/2, H2/2, '#ff7070', 20);

                addDot(false); streak=0; stCountEl.textContent=streak;
                svCountEl.textContent=survives;
                isSpun=false;
                animState.isFiring = false;
                spinBtn.disabled=false;
                spinBtn.textContent='⟳  TRY AGAIN';
                setOdds(0,1);
            });
        } else {
            /* ══ CLICK — empty ══ */
            animDryfire(() => {
                playEmpty();
                animGunCss('dryfire');
                card.classList.add('sglow');
                setTimeout(()=>card.classList.remove('sglow'), 900);
                setStatus('CLICK — SURVIVED', 'safe');

                const r = card.getBoundingClientRect();
                burst(r.left+r.width/2, r.top+60, '#2ecc71', 28);
                burst(r.left+r.width/2, r.top+60, '#27ae60', 18);

                survives++; streak++;
                svCountEl.textContent=survives;
                stCountEl.textContent=streak;
                addDot(true);

                isSpun = false;
                // Advance cylinder one click
                animCylSpin(Math.PI/3, 300, null);
                currentPos = (currentPos+1)%6;

                playThud();
                animState.isFiring = false;
                spinBtn.disabled = false;
                shootBtn.disabled = true;
                spinBtn.textContent = '⟳  SPIN';
                setOdds(4,5);
            });
        }
    }, 480);
});

setOdds(5, 6);

/* ═══════════════════════════════════════════════════════════════
   BACKGROUND COLOR PICKER
═══════════════════════════════════════════════════════════════ */
const PRESETS = [
    '#07090c','#0a0f1a','#0d1520','#111827',
    '#1a0a0a','#0a1a0a','#0a0a1a','#1a1000',
    '#1e1e2e','#2d1b33','#0f2027','#1a1a1a',
    '#ffffff','#f0e8d8','#d0e8f0','#e8d0e0',
];

// Build preset swatches panel
const presetsEl = document.createElement('div');
presetsEl.id = 'bgPresets';
PRESETS.forEach(hex => {
    const s = document.createElement('div');
    s.className = 'bgp';
    s.style.background = hex;
    s.title = hex;
    s.addEventListener('click', () => { applyBg(hex); presetsEl.classList.remove('open'); });
    presetsEl.appendChild(s);
});
// Custom color row
const customRow = document.createElement('div');
customRow.id = 'bgCustomRow';
customRow.innerHTML = '<label>Custom</label><input type="color" id="bgColorInput2" value="#07090c">';
presetsEl.appendChild(customRow);
document.body.appendChild(presetsEl);

// Picker trigger button (bottom-left)
const btnEl = document.createElement('div');
btnEl.id = 'bgPickerBtn';
btnEl.innerHTML = '<div id="bgSwatch"></div><span>Background</span>';
document.body.appendChild(btnEl);

const swatchEl  = document.getElementById('bgSwatch');
const colorIn   = document.getElementById('bgColorInput2');

btnEl.addEventListener('click', e => {
    e.stopPropagation();
    presetsEl.classList.toggle('open');
});
document.addEventListener('click', () => presetsEl.classList.remove('open'));
presetsEl.addEventListener('click', e => e.stopPropagation());
colorIn.addEventListener('input', () => applyBg(colorIn.value));

function applyBg(hex) {
    // CSS background
    document.documentElement.style.setProperty('--bg', hex);
    document.body.style.background = hex;
    // Three.js scene
    const c = new THREE.Color(hex);
    scene.background = c;
    scene.fog = new THREE.FogExp2(c.getHex(), 0.032);
    // Swatch preview
    swatchEl.style.background = hex;
    colorIn.value = hex;
}
</script>
