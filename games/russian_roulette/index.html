<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Roulette — S&W .38 Military & Police</title>

    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --red:#e74c3c;--gold:#f0b429;--green:#2ecc71;
            --bg:#07090c;--card:#0d1520;--card2:#111d2a;
            --border:#192536;--b2:#1e2e42;--text:#c0d0e0;--dim:#42586e;
        }
        html,body{height:100%;overflow:hidden}
        body{
            background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
            min-height:100vh;position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background-image:linear-gradient(rgba(231,76,60,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(231,76,60,.02) 1px,transparent 1px);
            background-size:48px 48px;pointer-events:none;z-index:0;
        }
        body::after{
            content:'';position:fixed;inset:0;
            background:radial-gradient(ellipse 70% 45% at 50% 0%,rgba(231,76,60,.06) 0%,transparent 65%);
            pointer-events:none;z-index:0;
        }
        #particles{position:fixed;inset:0;pointer-events:none;z-index:1}
        #bloodOverlay{
            position:fixed;inset:0;
            background:radial-gradient(ellipse at center,transparent 20%,rgba(130,5,5,.97) 100%);
            opacity:0;pointer-events:none;transition:opacity .5s ease;z-index:200;
        }
        #bloodOverlay.active{opacity:1}
        #flashOverlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:202;transition:opacity .04s}

        .layout{
            position:relative;z-index:10;
            display:flex;flex-direction:row;align-items:center;
            width:100vw;height:100vh;
        }

        .gun-col{
            flex:1 1 0;
            display:flex;align-items:stretch;justify-content:stretch;
            height:100%;
            position:relative;
            overflow:hidden;
        }

        .ui-col{
            flex:0 0 320px;
            display:flex;flex-direction:column;
            justify-content:center;
            align-items:stretch;
            height:100%;
            padding:24px 28px 24px 8px;
            gap:14px;
        }

        .title{
            font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,3.2vw,2.8rem);
            letter-spacing:8px;color:var(--red);
            text-shadow:0 0 40px rgba(231,76,60,.6),0 0 80px rgba(231,76,60,.15);
            line-height:1;user-select:none;
        }
        .tagline{font-size:.60rem;letter-spacing:4px;text-transform:uppercase;color:var(--dim);margin-top:4px}

        #gunWrap{
            position:relative;
            width:100%;
            height:100%;
            flex:1;
        }
        #threeContainer{
            position:absolute;
            inset:0;
            width:100% !important;
            height:100% !important;
        }
        #gunWrap.recoil {animation:recoil  .35s cubic-bezier(.1,.7,.3,1) forwards}
        #gunWrap.dryfire{animation:dryfire .18s ease-out forwards}
        @keyframes recoil{
            0%  {transform:translate(0,0) scale(1) rotate(0deg)}
            20% {transform:translate(-4px,14px) scale(.98) rotate(1deg)}
            50% {transform:translate(2px,-6px) scale(1.01) rotate(-.5deg)}
            100%{transform:translate(0,0) scale(1) rotate(0deg)}
        }
        @keyframes dryfire{
            0%  {transform:translate(0,0) scale(1)}
            50% {transform:translate(0,3px) scale(.995)}
            100%{transform:translate(0,0) scale(1)}
        }

        #muzzleFlash{
            position:absolute;left:28%;top:46%;
            transform:translate(-50%,-50%);
            width:0;height:0;border-radius:50%;pointer-events:none;opacity:0;z-index:20;
        }
        #muzzleFlash.bang{animation:muzzBang .28s ease-out forwards}
        @keyframes muzzBang{
            0%  {opacity:1;width:0;height:0;box-shadow:0 0 0 0 #fff,0 0 0 0 #ffe066,0 0 0 0 rgba(231,76,60,.9)}
            30% {opacity:1;width:130px;height:130px;margin:-65px;box-shadow:0 0 55px 22px #fff,0 0 95px 40px #ffe066,0 0 150px 55px rgba(231,76,60,.6)}
            100%{opacity:0;width:170px;height:170px;margin:-85px;box-shadow:0 0 0 0 transparent}
        }
        #smokeEl{
            position:absolute;left:28%;top:46%;transform:translate(-50%,-50%);
            width:12px;height:12px;border-radius:50%;background:rgba(180,200,220,.5);
            filter:blur(6px);opacity:0;pointer-events:none;z-index:19;
        }
        #smokeEl.puff{animation:smokeDrift 1.4s ease-out forwards}
        @keyframes smokeDrift{
            0%  {opacity:.6;transform:translate(-50%,-50%) scale(1)}
            100%{opacity:0;transform:translate(-50%,-130px) scale(7)}
        }

        #threeCanvas{
            width:100%!important;height:100%!important;
            display:block;cursor:grab;
        }
        #threeCanvas:active{cursor:grabbing;}

        /* ── Camera Quick-View HUD ── */
        .cam-bar{
            position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
            display:flex;gap:8px;background:rgba(13,21,32,.78);
            border:1px solid var(--border);border-radius:99px;
            padding:5px 8px;backdrop-filter:blur(10px);z-index:30;
            box-shadow:0 8px 30px rgba(0,0,0,.6);
        }
        .cam-btn{
            background:transparent;border:none;outline:none;
            color:var(--dim);font-family:'Bebas Neue',sans-serif;
            font-size:.85rem;letter-spacing:1.5px;padding:6px 12px;
            border-radius:99px;cursor:pointer;transition:all .18s;
            display:flex;align-items:center;gap:5px;
        }
        .cam-btn:hover{color:var(--text);background:rgba(255,255,255,.05)}
        .cam-btn.active{
            color:#fff;background:linear-gradient(135deg,rgba(231,76,60,.4),rgba(192,57,43,.8));
            box-shadow:0 2px 10px rgba(231,76,60,.4);
        }

        /* ── Cylinder Visualizer HUD ── */
        .chamber-hud{
            display:flex;gap:7px;align-items:center;justify-content:center;
            padding:4px 0 2px;width:100%;
        }
        .ch-pip{
            width:14px;height:14px;border-radius:50%;
            border:1.5px solid var(--border);background:var(--card2);
            transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative;
        }
        .ch-pip.ready{border-color:var(--gold);box-shadow:0 0 8px rgba(240,180,41,.4);background:rgba(240,180,41,.18)}
        .ch-pip.current{transform:scale(1.28);border-color:#fff;box-shadow:0 0 12px #fff}
        .ch-pip.safe{border-color:var(--green);background:var(--green);box-shadow:0 0 8px rgba(46,204,113,.5)}
        .ch-pip.dead{border-color:var(--red);background:var(--red);box-shadow:0 0 10px rgba(231,76,60,.7)}

        .card{
            background:var(--card);border:1px solid var(--border);border-radius:20px;
            padding:20px 20px 16px;width:100%;
            box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.04);
            display:flex;flex-direction:column;align-items:center;gap:14px;
        }
        .card.shake{animation:shake .45s ease}
        .card.sglow {animation:sglow  .8s ease}
        @keyframes shake{
            0%,100%{transform:translate(0,0)}
            15%{transform:translate(-7px,3px)}30%{transform:translate(7px,-3px)}
            50%{transform:translate(-5px,4px)}70%{transform:translate(5px,-3px)}85%{transform:translate(-3px,2px)}
        }
        @keyframes sglow{
            0%,100%{box-shadow:0 20px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.04)}
            45%    {box-shadow:0 20px 60px rgba(0,0,0,.75),0 0 40px rgba(46,204,113,.2),inset 0 1px 0 rgba(255,255,255,.04)}
        }
        .divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--b2) 30%,var(--b2) 70%,transparent)}
        .status{
            height:28px;display:flex;align-items:center;justify-content:center;
            font-size:.86rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
            color:var(--gold);text-shadow:0 0 12px rgba(240,180,41,.3);transition:color .3s,text-shadow .3s;
        }
        .status.danger{color:var(--red);text-shadow:0 0 18px rgba(231,76,60,.65);animation:pulseRed .45s infinite alternate}
        .status.safe  {color:var(--green);text-shadow:0 0 14px rgba(46,204,113,.5)}
        .status.idle  {color:var(--dim);text-shadow:none}
        @keyframes pulseRed{to{opacity:.5}}
        .btn-group{display:flex;gap:12px;width:100%}
        .btn{
            flex:1;padding:14px 10px;font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:2px;
            border:1px solid transparent;border-radius:10px;cursor:pointer;
            transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;color:#fff;
        }
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,transparent 55%);border-radius:inherit;pointer-events:none}
        .btn-spin{
            background:linear-gradient(170deg,#1d7db8,#1a5f8c 55%,#153f60);
            border-color:rgba(52,152,219,.25);box-shadow:0 4px 16px rgba(25,80,120,.55),inset 0 1px 0 rgba(255,255,255,.09);
        }
        .btn-spin:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 22px rgba(52,152,219,.4),inset 0 1px 0 rgba(255,255,255,.09)}
        .btn-shoot{
            background:linear-gradient(170deg,#bf3a2a,#962020 55%,#6e1515);
            border-color:rgba(192,57,43,.3);box-shadow:0 4px 16px rgba(140,30,20,.55),inset 0 1px 0 rgba(255,255,255,.07);
        }
        .btn-shoot:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 22px rgba(231,76,60,.45),inset 0 1px 0 rgba(255,255,255,.07)}
        .btn:active:not(:disabled){transform:translateY(1px)!important}
        .btn:disabled{background:rgba(255,255,255,.035)!important;border-color:var(--border)!important;color:var(--dim)!important;box-shadow:none!important;transform:none!important;cursor:not-allowed}
        .bottom{width:100%;display:flex;flex-direction:column;gap:12px}
        .odds-row{width:100%;display:flex;flex-direction:column;gap:5px}
        .odds-header{display:flex;justify-content:space-between;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
        .odds-val{font-family:'Bebas Neue',sans-serif;font-size:.82rem;color:var(--text)}
        .odds-track{width:100%;height:5px;background:rgba(255,255,255,.04);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
        .odds-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold) 65%,var(--red));border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);width:83.33%}
        .stats{display:flex;gap:9px;justify-content:center}
        .stat-pill{background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:6px 15px;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--dim)}
        .sval{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--text)}
        .history{display:flex;gap:5px;justify-content:center;min-height:11px}
        .hdot{width:9px;height:9px;border-radius:50%;background:var(--b2)}
        .hdot.s{background:var(--green);box-shadow:0 0 5px rgba(46,204,113,.6)}
        .hdot.d{background:var(--red);  box-shadow:0 0 5px rgba(231,76,60,.6)}
        .hdot.new{animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
        @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

        /* ══════════════════════════════════════
           SETUP SCREEN
        ══════════════════════════════════════ */
        #setupScreen{
            position:fixed;inset:0;z-index:400;
            background:var(--bg);
            display:flex;align-items:center;justify-content:center;
            padding:24px;
        }
        .setup-box{
            background:var(--card);border:1px solid var(--border);border-radius:24px;
            padding:32px 28px;width:100%;max-width:420px;
            box-shadow:0 24px 80px rgba(0,0,0,.8);
            display:flex;flex-direction:column;gap:20px;
        }
        .setup-title{
            font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:8px;
            color:var(--red);text-align:center;
            text-shadow:0 0 30px rgba(231,76,60,.5);
        }
        .setup-sub{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:-14px}
        .setup-count-row{display:flex;gap:10px;justify-content:center}
        .count-btn{
            font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1px;
            width:52px;height:52px;border-radius:12px;border:1px solid var(--border);
            background:var(--card2);color:var(--dim);cursor:pointer;
            transition:all .15s;display:flex;align-items:center;justify-content:center;
        }
        .count-btn:hover{border-color:var(--text);color:var(--text)}
        .count-btn.active{
            background:linear-gradient(170deg,#bf3a2a,#6e1515);
            border-color:rgba(192,57,43,.4);color:#fff;
            box-shadow:0 4px 18px rgba(140,30,20,.5);
        }
        .setup-seats{display:flex;flex-direction:column;gap:10px}
        .seat-row{
            display:flex;align-items:center;gap:12px;
            background:var(--card2);border:1px solid var(--border);
            border-radius:12px;padding:10px 14px;
        }
        .seat-num{
            font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;
            color:var(--dim);min-width:22px;
        }
        .seat-select{
            flex:1;background:transparent;border:none;outline:none;
            color:var(--text);font-size:.88rem;font-family:'Inter',sans-serif;
            cursor:pointer;
        }
        .seat-select option{background:var(--card);color:var(--text)}
        .seat-avatar{
            width:36px;height:36px;border-radius:50%;object-fit:cover;
            border:2px solid var(--border);flex-shrink:0;
            background:var(--card);
        }
        .btn-start{
            font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;
            padding:16px;border-radius:12px;border:1px solid rgba(192,57,43,.3);
            background:linear-gradient(170deg,#bf3a2a,#962020 55%,#6e1515);
            color:#fff;cursor:pointer;
            box-shadow:0 4px 18px rgba(140,30,20,.5);
            transition:transform .12s,box-shadow .12s;
        }
        .btn-start:hover{transform:translateY(-2px);box-shadow:0 7px 26px rgba(231,76,60,.45)}
        .btn-start:active{transform:translateY(1px)}
        .btn-start:disabled{opacity:.35;cursor:not-allowed;transform:none}

        /* ══════════════════════════════════════
           PLAYER TURN INDICATOR (in right panel)
        ══════════════════════════════════════ */

        /* ── Settings button (top-right of UI panel) ── */
        #settingsBtn{
            position:absolute;top:18px;right:18px;z-index:50;
            width:36px;height:36px;border-radius:50%;
            background:rgba(13,21,32,.85);border:1px solid var(--border);
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;backdrop-filter:blur(8px);
            color:var(--dim);font-size:1rem;
            transition:border-color .2s,color .2s;
            user-select:none;
        }
        #settingsBtn:hover{border-color:var(--text);color:var(--text)}

        /* Settings panel */
        #settingsPanel{
            display:none;
            position:absolute;top:60px;right:18px;z-index:60;
            background:var(--card);border:1px solid var(--border);
            border-radius:16px;padding:18px 18px;width:260px;
            box-shadow:0 16px 48px rgba(0,0,0,.7);
            backdrop-filter:blur(12px);
            flex-direction:column;gap:16px;
        }
        #settingsPanel.open{display:flex}
        .settings-title{
            font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:4px;
            color:var(--text);border-bottom:1px solid var(--border);
            padding-bottom:10px;
        }
        .setting-row{display:flex;flex-direction:column;gap:6px}
        .setting-label{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
        .setting-desc{font-size:.6rem;color:var(--dim);opacity:.7;margin-top:-2px}
        .setting-control{display:flex;gap:6px;flex-wrap:wrap}
        /* hide number input spin arrows */
        #elimInput::-webkit-outer-spin-button,
        #elimInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
        #elimInput{-moz-appearance:textfield}

        /* Vertical player stats list */
        #seatRow{
            display:none;flex-direction:column;gap:8px;
        }
        #seatRow.visible{display:flex}
        .seat-pip{
            display:flex;align-items:center;gap:12px;
            background:var(--card2);border:1px solid var(--border);
            border-radius:4px;padding:10px 14px;
            transition:border-color .2s,box-shadow .2s,opacity .2s;
        }
        .seat-pip.active{
            border-color:var(--gold);
            box-shadow:0 0 16px rgba(240,180,41,.20);
        }
        .seat-pip.eliminated{
            opacity:.35;filter:grayscale(.9);
            border-color:var(--red) !important;
        }
        .seat-pip img{
            width:42px;height:42px;border-radius:50%;object-fit:cover;
            border:2px solid var(--border);flex-shrink:0;
        }
        .seat-pip.active img{border-color:var(--gold)}
        .seat-pip.eliminated img{border-color:var(--red)}
        .pip-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
        .pip-name{
            font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;
            color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            flex:1;
        }
        .pip-badge{
            display:flex;align-items:center;
            border-radius:6px;padding:2px 8px;flex-shrink:0;
        }
        .pip-badge-val{
            font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:1px;
        }
        .pip-badge.deaths   .pip-badge-val{color:#e87070}
        .pip-badge.survived .pip-badge-val{color:#6ed886}
        .pip-turn{display:none}
        .pip-elim-tag{
            font-size:.5rem;letter-spacing:2px;text-transform:uppercase;
            color:var(--red);font-weight:600;flex-shrink:0;
        }

        #bgPickerBtn{
            position:fixed;bottom:18px;left:18px;z-index:300;
            display:flex;align-items:center;gap:8px;
            background:rgba(13,21,32,.85);border:1px solid var(--border);
            border-radius:99px;padding:6px 12px 6px 8px;
            cursor:pointer;backdrop-filter:blur(8px);
            font-size:.68rem;letter-spacing:2px;text-transform:uppercase;
            color:var(--dim);transition:border-color .2s,color .2s;
            user-select:none;
        }
        #bgPickerBtn:hover{border-color:var(--text);color:var(--text)}
        #bgSwatch{
            width:16px;height:16px;border-radius:50%;
            background:#07090c;border:1.5px solid rgba(255,255,255,.15);
            flex-shrink:0;transition:background .2s;
        }
        #bgPresets{
            position:fixed;bottom:56px;left:18px;z-index:301;
            display:none;flex-wrap:wrap;gap:7px;
            background:rgba(13,21,32,.92);border:1px solid var(--border);
            border-radius:14px;padding:12px;
            backdrop-filter:blur(10px);
            width:192px;
        }
        #bgPresets.open{display:flex}
        .bgp{
            width:28px;height:28px;border-radius:50%;cursor:pointer;
            border:2px solid transparent;transition:transform .12s,border-color .15s;
        }
        .bgp:hover{transform:scale(1.18);border-color:rgba(255,255,255,.4)}
        #bgCustomRow{
            width:100%;display:flex;align-items:center;gap:8px;
            padding-top:6px;border-top:1px solid var(--border);margin-top:2px;
        }
        #bgCustomRow label{font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);flex:1}
        #bgColorInput2{width:32px;height:24px;border:none;padding:0;background:none;cursor:pointer;border-radius:4px}
    </style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="bloodOverlay"></div>
<div id="flashOverlay"></div>

<!-- ══════════════════════════════════════
     SETUP SCREEN (shown first)
══════════════════════════════════════ -->
<div id="setupScreen">
    <div class="setup-box">
        <div class="setup-title">RUSSIAN ROULETTE</div>
        <div class="setup-sub">Select players</div>

        <!-- How many players -->
        <div>
            <div style="font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;text-align:center">Number of Players</div>
            <div class="setup-count-row" id="countBtns">
                <button class="count-btn" data-n="2">2</button>
                <button class="count-btn" data-n="3">3</button>
                <button class="count-btn active" data-n="4">4</button>
            </div>
        </div>

        <!-- Seat assignment dropdowns (built by JS) -->
        <div class="setup-seats" id="setupSeats"></div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>
</div>

<div class="layout">
    <div class="gun-col">
        <div id="gunWrap">
            <div id="muzzleFlash"></div>
            <div id="smokeEl"></div>
            <div id="threeContainer"></div>
            <div class="cam-bar" id="camBar">
                <button class="cam-btn active" data-view="default">📐 PERSPECTIVE</button>
                <button class="cam-btn" data-view="sight">🎯 SIGHT</button>
                <button class="cam-btn" data-view="rear">🔍 BACK & HAMMER</button>
                <button class="cam-btn" data-view="cylinder">⚙ CYLINDER</button>
            </div>
        </div>
    </div>

    <div class="ui-col" style="position:relative">
        <!-- Settings button -->
        <div id="settingsBtn" title="Settings">⚙</div>

        <!-- Settings panel -->

/* ── STUDIO REFLECTION ENVIRONMENT MAP ── */
function generateStudioEnv() {
    const pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileEquirectangularShader();

    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#c8d8ea');
    grad.addColorStop(0.3, '#788ca0');
    grad.addColorStop(0.5, '#2e3844');
    grad.addColorStop(0.7, '#151b22');
    grad.addColorStop(1, '#090c10');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);

    function addLight(x, y, w, h, col, blur) {
        ctx.save();
        ctx.filter = `blur(${blur}px)`;
        ctx.fillStyle = col;
        ctx.fillRect(x, y, w, h);
        ctx.restore();
    }
    addLight(600, 40, 260, 160, 'rgba(255,255,255,0.95)', 25);
    addLight(80, 20, 400, 90, 'rgba(210,230,255,0.8)', 20);
    addLight(180, 280, 280, 110, 'rgba(245,220,190,0.35)', 35);
    addLight(860, 100, 130, 200, 'rgba(180,210,245,0.55)', 28);

    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const envMap = pmremGen.fromEquirectangular(tex).texture;
    pmremGen.dispose();
    return envMap;
}
scene.environment = generateStudioEnv();

/* ── AUTHENTIC HIGH-GRADE OILED WALNUT TEXTURE ── */
function generateWalnutTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 1024;
    const ctx = c.getContext('2d');

    // Deep, rich dark walnut foundation
    const bgGrad = ctx.createLinearGradient(0, 0, 1024, 0);
    bgGrad.addColorStop(0, '#2d180c');
    bgGrad.addColorStop(0.3, '#3a1f11');
    bgGrad.addColorStop(0.6, '#281309');
    bgGrad.addColorStop(1, '#331a0e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1024, 1024);

    // Subtle natural wood growth rings
    for (let i = 0; i < 220; i++) {
        const y = Math.random() * 1024;
        const alpha = Math.random() * 0.32 + 0.08;
        ctx.strokeStyle = Math.random() > 0.4 ? `rgba(20, 8, 4, ${alpha})` : `rgba(78, 42, 22, ${alpha * 0.8})`;
        ctx.lineWidth = Math.random() * 4.5 + 0.8;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(
            320, y + (Math.random() - 0.5) * 35,
            680, y + (Math.random() - 0.5) * 35,
            1024, y + (Math.random() - 0.5) * 20
        );
        ctx.stroke();
    }

    // Fine wood pores & satin gunstock sheen
    const imgData = ctx.getImageData(0, 0, 1024, 1024);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 16;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise * 0.7));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise * 0.5));
    }
    ctx.putImageData(imgData, 0, 0);

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1.4, 1.4);
    return tex;
}

/* ═══════════════════════════════════════════════════════════════
   4. MATHEMATICALLY SCALLOPED 6-SHOT FLUTED CYLINDER
═══════════════════════════════════════════════════════════════ */
const cylinderGroup = new THREE.Group();
cylinderGroup.position.set(0, 0, 0.0);
gunRoot.add(cylinderGroup);

const CYL_R = 0.435;
const CYL_L = 1.12;

// Generate 2D fluted cylinder profile with 6 smooth concave flutes
const cylShape = new THREE.Shape();
const STEPS = 96;
for (let i = 0; i <= STEPS; i++) {
    const a = (i / STEPS) * Math.PI * 2;
    let minDiff = Infinity;
    for (let k = 0; k < 6; k++) {
        const fa = (k * Math.PI / 3) + (Math.PI / 6);
        let diff = Math.abs(a - fa);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff < minDiff) minDiff = diff;
    }
    let r = CYL_R;
    const fluteWidth = 0.21;
    if (minDiff < fluteWidth) {
        const factor = Math.cos((minDiff / fluteWidth) * (Math.PI / 2));
        r -= 0.062 * (factor * factor);
    }
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) cylShape.moveTo(px, py);
    else cylShape.lineTo(px, py);
}

// Cut 6 circular chamber holes through the cylinder
const CHAMBER_DIST = 0.245;
for (let k = 0; k < 6; k++) {
    const ca = (k * Math.PI / 3) + (Math.PI / 2);
    const cx = Math.cos(ca) * CHAMBER_DIST;
    const cy = Math.sin(ca) * CHAMBER_DIST;

    const chamberHole = new THREE.Path();
    const chSteps = 20;
    for (let j = 0; j <= chSteps; j++) {
        const ja = (j / chSteps) * Math.PI * 2;
        const hx = cx + Math.cos(ja) * 0.082;
        const hy = cy + Math.sin(ja) * 0.082;
        if (j === 0) chamberHole.moveTo(hx, hy);
        else chamberHole.lineTo(hx, hy);
    }
    cylShape.holes.push(chamberHole);
}

const cylExtrudeSettings = {
    steps: 1,
    depth: CYL_L,
    bevelEnabled: true,
    bevelThickness: 0.02,
    bevelSize: 0.018,
    bevelSegments: 3
};

const cylGeo = new THREE.ExtrudeGeometry(cylShape, cylExtrudeSettings);
cylGeo.center();
const cylMesh = new THREE.Mesh(cylGeo, matCylinder);
cylinderGroup.add(cylMesh);

// Center extractor shaft pin
const centerPin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.065, 0.065, CYL_L + 0.16, 16),
    matSteel
);
centerPin.rotation.x = Math.PI / 2;
cylinderGroup.add(centerPin);

// Rear extractor star ratchet

starRatchet.rotation.x = Math.PI / 2;
starRatchet.position.set(0, 0, CYL_L / 2 + 0.015);
cylinderGroup.add(starRatchet);

// 6 Brass Cartridges visible inside the chambers
for (let k = 0; k < 6; k++) {
    const ca = (k * Math.PI / 3) + (Math.PI / 2);
    const cx = Math.cos(ca) * CHAMBER_DIST;
    const cy = Math.sin(ca) * CHAMBER_DIST;

    const cart = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 0.05, 14),
        matBrass
    );
    cart.rotation.x = Math.PI / 2;
    cart.position.set(cx, cy, CYL_L / 2 + 0.01);
    cylinderGroup.add(cart);

    const primer = new THREE.Mesh(
        new THREE.CylinderGeometry(0.028, 0.028, 0.055, 10),
        matSilver
    );
    primer.rotation.x = Math.PI / 2;
    primer.position.set(cx, cy, CYL_L / 2 + 0.012);
    cylinderGroup.add(primer);

    // Stop notches near rear edge
    const notch = new THREE.Mesh(
        new THREE.BoxGeometry(0.03, 0.035, 0.08),
        matDark
    );
    notch.position.set(
        Math.cos(ca) * (CYL_R - 0.01),
        Math.sin(ca) * (CYL_R - 0.01),
        CYL_L / 2 - 0.12
    );
    notch.rotation.z = ca;
    cylinderGroup.add(notch);
}

/* ═══════════════════════════════════════════════════════════════
   5. AUTHENTIC CURVED S&W HAMMER & PROMINENT CHECKERED SPUR
═══════════════════════════════════════════════════════════════ */
const hammerPivot = new THREE.Group();

const animState = {

};

function renderLoop() {
    requestAnimationFrame(renderLoop);
    const delta = 0.016;

    // Smooth spring recoil recovery
    animState.recoilRot += (0 - animState.recoilRot) * 16 * delta;
    animState.recoilZ   += (0 - animState.recoilZ)   * 16 * delta;
    gunRoot.rotation.x = animState.recoilRot;
    gunRoot.position.z = animState.recoilZ;

    // Gentle idle breathing
    if (!animState.isFiring && !animState.isSpinning) {
        animState.breathT += delta;
        gunRoot.position.y = Math.sin(animState.breathT * 1.1) * 0.012;
    }

    controls.update();
    renderer.render(scene, camera);
}
renderLoop();

function animCylSpin(totalExtraRot, duration, onDone) {
    const start = performance.now();
    const startRot = cylinderGroup.rotation.z;
    const endRot = startRot + totalExtraRot;

    function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        const e = 1 - Math.pow(1 - p, 3);
        cylinderGroup.rotation.z = startRot + (endRot - startRot) * e;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            cylinderGroup.rotation.z = endRot;
            if (onDone) onDone();
        }
    }
    requestAnimationFrame(tick);
}

function animTriggerPull(onFire) {
    const start = performance.now();
    const pullDur = 190;

    function tick(now) {
        const p = Math.min((now - start) / pullDur, 1);
        const s = p * p * (3 - 2 * p);
        triggerPivot.rotation.x = -s * 0.42;
        hammerPivot.rotation.x  = -s * 0.72;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            hammerPivot.rotation.x = 0.16;
            triggerPivot.rotation.x = 0;
            if (onFire) onFire();
            setTimeout(() => { hammerPivot.rotation.x = 0; }, 180);
        }
    }
    requestAnimationFrame(tick);
}

function animDryfire(onDone) {
    const start = performance.now();
    function tick(now) {
        const p = Math.min((now - start) / 130, 1);
        const s = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
        triggerPivot.rotation.x = -s * 0.20;
        hammerPivot.rotation.x  = -s * 0.30;
        if (p < 1) {
            requestAnimationFrame(tick);
        } else {
            triggerPivot.rotation.x = 0;
            hammerPivot.rotation.x  = 0;
            if (onDone) onDone();
        }
    }
    requestAnimationFrame(tick);
}

const AC = new (window.AudioContext || window.webkitAudioContext)();
const resumeAC = () => { if (AC.state === 'suspended') AC.resume(); };

const playRatchet = () => {
    resumeAC(); const t = AC.currentTime;
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(1500 + Math.random() * 200, t);
    o.frequency.exponentialRampToValueAtTime(320, t + 0.024);
    f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 6;
    g.gain.setValueAtTime(0.24, t); g.gain.linearRampToValueAtTime(0.001, t + 0.024);
    o.connect(f); f.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + 0.024);
};

const playThud = () => {
    resumeAC(); const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.08);
    g.gain.setValueAtTime(0.5, t); g.gain.linearRampToValueAtTime(0.001, t + 0.08);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.08);
};

const playTrigger = () => {
    resumeAC(); const t = AC.currentTime;
    [[1900, 420, 0.038, 'sine', 0, 0.36], [160, 36, 0.065, 'triangle', 0.03, 0.45]].forEach(([f1, f2, d, tp, dl, v]) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = tp;
        o.frequency.setValueAtTime(f1, t + dl);
        o.frequency.exponentialRampToValueAtTime(f2, t + dl + d);
        g.gain.setValueAtTime(v, t + dl); g.gain.linearRampToValueAtTime(0.001, t + dl + d);
        o.connect(g); g.connect(AC.destination); o.start(t + dl); o.stop(t + dl + d);
    });
};

const playEmpty = () => {
    resumeAC(); const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(740, t);
    o.frequency.exponentialRampToValueAtTime(210, t + 0.055);
    g.gain.setValueAtTime(0.16, t); g.gain.linearRampToValueAtTime(0.001, t + 0.055);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.055);
};

const playBang = () => {
    resumeAC(); const t = AC.currentTime, dur = 2.2;
    const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const ns = AC.createBufferSource(); ns.buffer = buf;
    const fl = AC.createBiquadFilter(); fl.type = 'lowpass';
    fl.frequency.setValueAtTime(1300, t);
    fl.frequency.exponentialRampToValueAtTime(45, t + dur);
    const gn = AC.createGain();
    gn.gain.setValueAtTime(1, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    ns.connect(fl); fl.connect(gn); gn.connect(AC.destination); ns.start(t);

    const sb = AC.createOscillator(), sg = AC.createGain();
    sb.type = 'sine';
    sb.frequency.setValueAtTime(120, t); sb.frequency.exponentialRampToValueAtTime(26, t + 0.38);
    sg.gain.setValueAtTime(1, t); sg.gain.linearRampToValueAtTime(0.001, t + 0.38);
    sb.connect(sg); sg.connect(AC.destination); sb.start(t); sb.stop(t + 0.38);
};

const cv = document.getElementById('particles'), ctx = cv.getContext('2d');
let W2, H2;

    W2 = cv.width = window.innerWidth;
    H2 = cv.height = window.innerHeight;

const allP = [];
class Particle {
    constructor(x, y, col) {
        this.x = x; this.y = y; this.col = col;
        this.vx = (Math.random() - 0.5) * 7;
        this.vy = (Math.random() - 1.1) * 8;
        this.r = Math.random() * 4 + 1.5;
        this.life = 1;
    }
    step() { this.vx *= 0.97; this.vy += 0.16; this.x += this.vx; this.y += this.vy; this.life -= 0.02; }
    draw() {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.life);
        ctx.shadowColor = this.col; ctx.shadowBlur = 7;
        ctx.fillStyle = this.col; ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
}
function burst(x, y, col, n = 35) { for (let i = 0; i < n; i++) allP.push(new Particle(x, y, col)); }

const embers = Array.from({ length: 22 }, () => {
    const e = { reset() {
        this.x = Math.random() * window.innerWidth; this.y = window.innerHeight + 8;
        this.r = Math.random() * 1.6 + 0.3; this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = -(Math.random() * 0.5 + 0.2); this.alpha = Math.random() * 0.3 + 0.07; this.life = 1;
    }};
    e.reset(); e.y = Math.random() * window.innerHeight; return e;
});

(function pLoop() {
    ctx.clearRect(0, 0, W2, H2);
    for (let i = allP.length - 1; i >= 0; i--) {
        allP[i].step(); allP[i].draw();
        if (allP[i].life <= 0) allP.splice(i, 1);
    }
    for (const e of embers) {
        e.x += e.vx; e.y += e.vy; e.life -= 0.0025;
        ctx.save(); ctx.globalAlpha = e.alpha * e.life;
        ctx.fillStyle = '#e74c3c'; ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 5;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        if (e.life <= 0) e.reset();
    }
    requestAnimationFrame(pLoop);
})();

const CAM_PRESETS = {
    default: { pos: new THREE.Vector3(3.8, 1.4, 3.2),  tgt: new THREE.Vector3(-0.25, -0.05, -0.6) },
    sight:   { pos: new THREE.Vector3(0.0, 0.62, 2.5), tgt: new THREE.Vector3(0.0, 0.38, -3.2) },
    rear:    { pos: new THREE.Vector3(1.6, 0.95, 2.4), tgt: new THREE.Vector3(0.0, -0.22, 0.45) },
    cylinder:{ pos: new THREE.Vector3(2.2, 0.35, 0.3), tgt: new THREE.Vector3(0.0, 0.0, -0.1) }
};

function transitionCamera(endPos, endTgt, dur = 650) {
    const startPos = camera.position.clone();
    const startTgt = controls.target.clone();
    const t0 = performance.now();
    (function camTick(now) {
        const p = Math.min((now - t0) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        camera.position.lerpVectors(startPos, endPos, e);
        controls.target.lerpVectors(startTgt, endTgt, e);
        controls.update();
        if (p < 1) requestAnimationFrame(camTick);
    })(performance.now());
}

function resetCamera() {
    const preset = CAM_PRESETS.default;
    transitionCamera(preset.pos, preset.tgt, 600);
}

        btn.classList.add('active');
        const view = btn.dataset.view;
        const targetView = CAM_PRESETS[view] || CAM_PRESETS.default;

function updateChamberHUD(outcome = '') {
    for (let i = 0; i < 6; i++) {
        const pip = document.getElementById(`ch${i}`);
        if (!pip) continue;
        pip.className = 'ch-pip';
        if (isSpun) {
            pip.classList.add('ready');
            if (i === currentPos) pip.classList.add('current');
        }
    }
    if (outcome === 'dead') {
        const curPip = document.getElementById(`ch${currentPos}`);
        if (curPip) curPip.className = 'ch-pip dead';
    } else if (outcome === 'safe') {
        const prev = (currentPos + 5) % 6;
        const prevPip = document.getElementById(`ch${prev}`);
        if (prevPip) prevPip.className = 'ch-pip safe';
    }
}

spinBtn.addEventListener('click', () => {
    if (spinBtn.disabled) return;
    spinBtn.disabled = true;
    shootBtn.disabled = true;
    bloodOv.classList.remove('active');
    setStatus('SPINNING...', '');
    animState.isSpinning = true;
    streak = 0; stCountEl.textContent = streak;

    resetCamera();
    bulletPos = Math.floor(Math.random() * 6);

    const fullTurns = (Math.floor(Math.random() * 3) + 3) * Math.PI * 2;
    const chamberOffset = Math.floor(Math.random() * 6) * (Math.PI / 3);
    const totalRot = fullTurns + chamberOffset;
    const spinDur  = 1300;

    let clicks = 0;
    const maxClicks = 22;
    const ratchetInterval = setInterval(() => {
        if (clicks++ < maxClicks) playRatchet();
        else clearInterval(ratchetInterval);
    }, spinDur / maxClicks);

    animCylSpin(totalRot, spinDur, () => {
        playThud();
        animState.isSpinning = false;
        currentPos = Math.round(
            ((2 * Math.PI - (cylinderGroup.rotation.z % (2 * Math.PI))) % (2 * Math.PI))
            / (Math.PI / 3)
        ) % 6;
        isSpun = true;
        spinBtn.disabled = false;
        shootBtn.disabled = false;
        setStatus('PULL THE TRIGGER', '');
        spins++;
        spCountEl.textContent = spins;
        setOdds(5, 6);
        updateChamberHUD();
    });
});

shootBtn.addEventListener('click', () => {
    if (!isSpun || shootBtn.disabled) return;
    spinBtn.disabled  = true;
    shootBtn.disabled = true;
    setStatus('...', '');
    playTrigger();
    animState.isFiring = true;

    setTimeout(() => {
        if (currentPos === bulletPos) {
            /* ══ BANG ══ */
            animTriggerPull(() => {
                playBang();
                screenFlash();
                animGunCss('recoil');
                triggerMuzzleFlash3D();
                triggerMuzzleCSS();

                // 3D physical recoil
                animState.recoilRot = 0.32;
                animState.recoilZ   = 0.20;

                setTimeout(() => { bloodOv.classList.add('active'); }, 55);
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
                setStatus('BANG', 'danger');

                burst(W2 / 2, H2 / 2, '#c0392b', 85);
                burst(W2 / 2, H2 / 2, '#e74c3c', 50);
                burst(W2 / 2, H2 / 2, '#ff7070', 20);

                updateChamberHUD('dead');
                addDot(false); streak = 0; stCountEl.textContent = streak;
                deaths++; svCountEl.textContent = deaths;
                if (gamePlayers.length) {
                    const cp = gamePlayers[currentPlayerIdx];
                    cp.deaths++;
                    if (elimAfter > 0 && cp.deaths >= elimAfter) {
                        cp.eliminated = true;
                    }
                    updatePips();
                }
                isSpun = false;
                animState.isFiring = false;
                spinBtn.disabled = false;
                spinBtn.textContent = '⟳  SPIN';
                setOdds(0, 1);
                if (gamePlayers.length) setTimeout(nextPlayer, 1200);
            });
        } else {
            /* ══ CLICK — survived, cylinder advances, keep firing ══ */
            animDryfire(() => {
                playEmpty();
                animGunCss('dryfire');
                card.classList.add('sglow');
                setTimeout(() => card.classList.remove('sglow'), 900);

                survives++; streak++;
                spCountEl.textContent = survives;
                stCountEl.textContent = streak;
                addDot(true);
                if (gamePlayers.length) gamePlayers[currentPlayerIdx].survived++;

                const r = card.getBoundingClientRect();
                burst(r.left + r.width / 2, r.top + 60, '#2ecc71', 28);
                burst(r.left + r.width / 2, r.top + 60, '#27ae60', 18);

                // Advance cylinder one chamber
                currentPos = (currentPos + 1) % 6;
                animCylSpin(Math.PI / 3, 280, null);
                playThud();
                updateChamberHUD('safe');

                const chambersLeft = 6 - streak;
                const safeLeft = Math.max(chambersLeft - 1, 0);
                if (safeLeft > 0) {
                    setStatus(`${safeLeft} LEFT`, 'safe');
                    setOdds(safeLeft, chambersLeft);
                } else {
                    setStatus('NEXT IS LIVE', 'danger');
                    setOdds(0, 1);
                }

                animState.isFiring = false;
                spinBtn.disabled = false;
                shootBtn.disabled = false;
                spinBtn.textContent = '⟳  SPIN';
                if (gamePlayers.length) nextPlayer();
            });
        }
    }, 450);
});

setOdds(5, 6);

/* ═══════════════════════════════════════════════════════════════
   PLAYER SYSTEM
═══════════════════════════════════════════════════════════════ */
const ALL_PLAYERS = [
    { name: 'Nahid', photo: 'player/Nahid.png' },
    { name: 'Nehal', photo: 'player/Nehal.png' },
    { name: 'Nupur', photo: 'player/Nupur.png' },
    { name: 'Saif',  photo: 'player/Saif.png'  },
];

let gamePlayers = [];
let currentPlayerIdx = 0;

/* ── Setup Screen ── */
const setupScreen    = document.getElementById('setupScreen');
const setupSeats     = document.getElementById('setupSeats');
const startBtn       = document.getElementById('startBtn');
const countBtns      = document.querySelectorAll('.count-btn');
const seatRowEl      = document.getElementById('seatRow');

let selectedCount = 4;

function buildSeats(n) {
    selectedCount = n;
    setupSeats.innerHTML = '';
    for (let i = 0; i < n; i++) {
        const row = document.createElement('div');
        row.className = 'seat-row';

        const num = document.createElement('div');
        num.className = 'seat-num';
        num.textContent = `P${i + 1}`;

        const img = document.createElement('img');
        img.className = 'seat-avatar';
        img.id = `seatAvatar${i}`;
        img.src = ALL_PLAYERS[i % ALL_PLAYERS.length].photo;

        const sel = document.createElement('select');
        sel.className = 'seat-select';
        sel.id = `seatSel${i}`;
        ALL_PLAYERS.forEach((p, pi) => {
            const opt = document.createElement('option');
            opt.value = pi;
            opt.textContent = p.name;
            if (pi === i % ALL_PLAYERS.length) opt.selected = true;
            sel.appendChild(opt);
        });
        sel.addEventListener('change', () => {
            img.src = ALL_PLAYERS[sel.value].photo;
        });

        row.appendChild(num);
        row.appendChild(img);
        row.appendChild(sel);
        setupSeats.appendChild(row);
    }
}

countBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        countBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        buildSeats(parseInt(btn.dataset.n));
    });
});

buildSeats(4);

startBtn.addEventListener('click', () => {
    gamePlayers = [];
    for (let i = 0; i < selectedCount; i++) {
        const sel = document.getElementById(`seatSel${i}`);
        const p   = ALL_PLAYERS[sel.value];
        gamePlayers.push({ name: p.name, photo: p.photo, deaths: 0, survived: 0, eliminated: false });
    }
    currentPlayerIdx = 0;

    setupScreen.style.display = 'none';
    seatRowEl.classList.add('visible');

    buildSeatPips();
    showCurrentPlayer();
});

/* ── Settings ── */
const settingsBtn   = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
let elimAfter = 0;

settingsBtn.addEventListener('click', e => {
    e.stopPropagation();
    settingsPanel.classList.toggle('open');
});
document.addEventListener('click', () => settingsPanel.classList.remove('open'));
settingsPanel.addEventListener('click', e => e.stopPropagation());

const elimInput = document.getElementById('elimInput');
elimInput.addEventListener('input', () => {
    const v = parseInt(elimInput.value);
    elimAfter = (isNaN(v) || v <= 0) ? 0 : v;
});

/* ── Seat pip row ── */
function buildSeatPips() {
    seatRowEl.innerHTML = '';
    gamePlayers.forEach((p, i) => {
        const pip = document.createElement('div');
        pip.className = 'seat-pip';
        pip.id = `pip${i}`;

        const img = document.createElement('img');
        img.src = p.photo; img.alt = p.name;

        const info = document.createElement('div');
        info.className = 'pip-info';

        const name = document.createElement('div');
        name.className = 'pip-name';
        name.textContent = p.name;

        const deathBadge = document.createElement('div');
        deathBadge.className = 'pip-badge deaths';
        deathBadge.id = `pipD${i}`;
        deathBadge.innerHTML = `<span class="pip-badge-val">0</span>`;

        const survBadge = document.createElement('div');
        survBadge.className = 'pip-badge survived';
        survBadge.id = `pipS${i}`;
        survBadge.innerHTML = `<span class="pip-badge-val">0</span>`;

        info.appendChild(name);
        info.appendChild(deathBadge);
        info.appendChild(survBadge);

        const turn = document.createElement('div');
        turn.className = 'pip-turn';
        turn.id = `pipTurn${i}`;

        pip.appendChild(img);
        pip.appendChild(info);
        pip.appendChild(turn);
        seatRowEl.appendChild(pip);
    });
}

function updatePips() {
    gamePlayers.forEach((p, i) => {
        const pip    = document.getElementById(`pip${i}`);
        const dEl    = document.getElementById(`pipD${i}`);
        const sEl    = document.getElementById(`pipS${i}`);
        const turnEl = document.getElementById(`pipTurn${i}`);
        if (!pip) return;

        const isElim = p.eliminated;
        pip.classList.toggle('active',      i === currentPlayerIdx && !isElim);
        pip.classList.toggle('eliminated',  isElim);

        if (dEl) dEl.querySelector('.pip-badge-val').textContent = p.deaths;
        if (sEl) sEl.querySelector('.pip-badge-val').textContent = p.survived;
        if (turnEl) {
            if (isElim)                     turnEl.textContent = 'OUT';
            else if (i === currentPlayerIdx) turnEl.textContent = '▶';
            else                             turnEl.textContent = '';
            turnEl.className = isElim ? 'pip-elim-tag' : 'pip-turn';
        }
    });
}

function showCurrentPlayer() {
    updatePips();
}

function nextPlayer() {
    if (!gamePlayers.length) return;
    const total = gamePlayers.length;
    let next = (currentPlayerIdx + 1) % total;
    let attempts = 0;
    while (gamePlayers[next].eliminated && attempts < total) {
        next = (next + 1) % total;
        attempts++;
    }
    currentPlayerIdx = next;
    showCurrentPlayer();
}

const PRESETS = [
    '#07090c','#0a0f1a','#0d1520','#111827',
    '#1a0a0a','#0a1a0a','#0a0a1a','#1a1000',
    '#1e1e2e','#2d1b33','#0f2027','#1a1a1a',
    '#ffffff','#f0e8d8','#d0e8f0','#e8d0e0',
];

const presetsEl = document.createElement('div');
presetsEl.id = 'bgPresets';
PRESETS.forEach(hex => {
    const s = document.createElement('div');
    s.className = 'bgp';
    s.style.background = hex;
    s.title = hex;
    s.addEventListener('click', () => { applyBg(hex); presetsEl.classList.remove('open'); });
    presetsEl.appendChild(s);
});

const customRow = document.createElement('div');
customRow.id = 'bgCustomRow';
customRow.innerHTML = '<label>Custom</label><input type="color" id="bgColorInput2" value="#07090c">';
presetsEl.appendChild(customRow);
document.body.appendChild(presetsEl);

const btnEl = document.createElement('div');
btnEl.id = 'bgPickerBtn';
btnEl.innerHTML = '<div id="bgSwatch"></div><span>Background</span>';
document.body.appendChild(btnEl);

const swatchEl = document.getElementById('bgSwatch');
const colorIn  = document.getElementById('bgColorInput2');

btnEl.addEventListener('click', e => { e.stopPropagation(); presetsEl.classList.toggle('open'); });
document.addEventListener('click', () => presetsEl.classList.remove('open'));
presetsEl.addEventListener('click', e => e.stopPropagation());
colorIn.addEventListener('input', () => applyBg(colorIn.value));

function applyBg(hex) {
    document.documentElement.style.setProperty('--bg', hex);
    document.body.style.background = hex;
    const c = new THREE.Color(hex);
    scene.background = c;
    scene.fog = new THREE.FogExp2(c.getHex(), 0.024);
    swatchEl.style.background = hex;
    colorIn.value = hex;
}
</script>
