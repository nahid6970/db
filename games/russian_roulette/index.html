<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red: #e74c3c;
            --gold: #f0b429;
            --green: #2ecc71;
            --bg: #07090c;
            --card: #0d1520;
            --card2: #111d2a;
            --border: #192536;
            --border2: #1e2e42;
            --text: #c0d0e0;
            --dim: #364d63;
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(231,76,60,0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(231,76,60,0.022) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(231,76,60,0.06) 0%, transparent 65%);
            pointer-events: none; z-index: 0;
        }

        #particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

        #bloodOverlay {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(140,8,8,0.96) 100%);
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease; z-index: 200;
        }
        #bloodOverlay.active { opacity: 1; }

        #flashOverlay {
            position: fixed; inset: 0;
            background: #fff; opacity: 0; pointer-events: none;
            z-index: 202; transition: opacity 0.04s;
        }

        /* ── Layout ── */
        .wrapper {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; gap: 10px;
            width: 100%; max-width: 440px;
            padding: 0 16px;
        }

        .title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 9vw, 4.2rem);
            letter-spacing: 10px;
            color: var(--red);
            text-shadow: 0 0 40px rgba(231,76,60,0.6), 0 0 80px rgba(231,76,60,0.15);
            line-height: 1; user-select: none;
        }
        .tagline {
            font-size: 0.68rem; letter-spacing: 4px;
            text-transform: uppercase; color: var(--dim);
        }

        /* ── Gun scene ── */
        .gun-scene {
            position: relative; width: 100%;
            display: flex; justify-content: center; align-items: center;
            height: 130px; margin-top: 4px;
        }

        .gun-wrap {
            position: relative; display: inline-block;
        }
        .gun-svg {
            width: 340px;
            filter:
                drop-shadow(0 8px 28px rgba(0,0,0,0.95))
                drop-shadow(0 2px 6px rgba(0,0,0,0.7))
                drop-shadow(0 0 1px rgba(100,160,220,0.06));
        }
        .gun-wrap.recoil { animation: recoil 0.32s cubic-bezier(0.1,0.7,0.3,1) forwards; }
        .gun-wrap.dryfire { animation: dryfire 0.18s ease-out forwards; }
        @keyframes recoil {
            0%   { transform: translate(0,0)         rotate(0deg);    }
            20%  { transform: translate(-12px,-18px) rotate(-11deg);  }
            50%  { transform: translate(6px,7px)     rotate(4.5deg);  }
            75%  { transform: translate(-3px,-2px)   rotate(-1deg);   }
            100% { transform: translate(0,0)         rotate(0deg);    }
        }
        @keyframes dryfire {
            0%   { transform: translate(0,0)       rotate(0deg);   }
            50%  { transform: translate(-3px,-3px) rotate(-2deg);  }
            100% { transform: translate(0,0)       rotate(0deg);   }
        }

        /* muzzle flash — BANG only */
        .muzzle {
            position: absolute;
            /* placed at barrel tip — adjusted to match gun SVG viewBox */
            right: -2px; top: 50%;
            transform: translateY(-50%);
            width: 0; height: 0;
            border-radius: 50%;
            pointer-events: none; opacity: 0;
        }
        .muzzle.bang { animation: muzzBang 0.2s ease-out forwards; }
        @keyframes muzzBang {
            0%  { opacity:1; width:0; height:0;
                  box-shadow: 0 0 0 0 #fff, 0 0 0 0 #ffe066, 0 0 0 0 rgba(231,76,60,0.8); }
            35% { opacity:1; width:72px; height:72px; margin:-36px;
                  box-shadow: 0 0 28px 8px #fff, 0 0 55px 18px #ffe066, 0 0 85px 28px rgba(231,76,60,0.6); }
            100%{ opacity:0; width:100px; height:100px; margin:-50px;
                  box-shadow: 0 0 0 0 rgba(255,230,100,0), 0 0 0 0 rgba(231,76,60,0), 0 0 0 0 transparent; }
        }

        .smoke-puff {
            position: absolute; right: 8px; top: 38%;
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(180,200,220,0.5);
            filter: blur(3px); opacity: 0; pointer-events: none;
        }
        .smoke-puff.puff { animation: smokeDrift 0.9s ease-out forwards; }
        @keyframes smokeDrift {
            0%   { opacity:0.6; transform:translate(0,0) scale(1); }
            100% { opacity:0;   transform:translate(12px,-24px) scale(3.5); }
        }

        /* ── Card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 22px 18px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.75),
                inset 0 1px 0 rgba(255,255,255,0.04),
                inset 0 -1px 0 rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
        }
        .card.shake { animation: shake 0.45s ease; }
        .card.sglow  { animation: sglow  0.8s ease; }
        @keyframes shake {
            0%,100%{ transform:translate(0,0); }
            15%    { transform:translate(-7px,3px); }
            30%    { transform:translate(7px,-3px); }
            50%    { transform:translate(-5px,4px); }
            70%    { transform:translate(5px,-3px); }
            85%    { transform:translate(-3px,2px); }
        }
        @keyframes sglow {
            0%,100%{ box-shadow:0 20px 60px rgba(0,0,0,0.75),inset 0 1px 0 rgba(255,255,255,0.04); }
            45%    { box-shadow:0 20px 60px rgba(0,0,0,0.75),0 0 40px rgba(46,204,113,0.18),inset 0 1px 0 rgba(255,255,255,0.04); }
        }

        .divider {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border2) 30%, var(--border2) 70%, transparent);
        }

        /* ── SVG Cylinder ── */
        .cyl-wrap {
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .cyl-pointer {
            position: absolute; top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid var(--gold);
            filter: drop-shadow(0 0 7px rgba(240,180,41,0.9));
            z-index: 3;
        }
        #cylSvg {
            width: 160px; height: 160px;
            overflow: visible;
        }

        /* ── Status ── */
        .status {
            height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.88rem; font-weight: 600;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(240,180,41,0.3);
            transition: color 0.3s, text-shadow 0.3s;
        }
        .status.danger {
            color: var(--red);
            text-shadow: 0 0 18px rgba(231,76,60,0.65);
            animation: pulseRed 0.45s infinite alternate;
        }
        .status.safe {
            color: var(--green);
            text-shadow: 0 0 14px rgba(46,204,113,0.5);
        }
        .status.idle { color: var(--dim); text-shadow: none; }
        @keyframes pulseRed { to { opacity: 0.5; } }

        /* ── Buttons ── */
        .btn-group { display: flex; gap: 12px; width: 100%; }
        .btn {
            flex: 1; padding: 14px 10px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.25rem; letter-spacing: 2px;
            border: 1px solid transparent;
            border-radius: 10px; cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            position: relative; overflow: hidden; color: #fff;
        }
        .btn::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 55%);
            border-radius: inherit; pointer-events: none;
        }
        .btn-spin {
            background: linear-gradient(170deg, #1d7db8 0%, #1a5f8c 55%, #153f60 100%);
            border-color: rgba(52,152,219,0.25);
            box-shadow: 0 4px 16px rgba(25,80,120,0.55), inset 0 1px 0 rgba(255,255,255,0.09);
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 22px rgba(52,152,219,0.4), inset 0 1px 0 rgba(255,255,255,0.09);
        }
        .btn-shoot {
            background: linear-gradient(170deg, #bf3a2a 0%, #962020 55%, #6e1515 100%);
            border-color: rgba(192,57,43,0.3);
            box-shadow: 0 4px 16px rgba(140,30,20,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .btn-shoot:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 22px rgba(231,76,60,0.45), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .btn:active:not(:disabled) { transform: translateY(1px) !important; }
        .btn:disabled {
            background: rgba(255,255,255,0.035) !important;
            border-color: var(--border) !important;
            color: var(--dim) !important;
            box-shadow: none !important; transform: none !important;
            cursor: not-allowed;
        }

        /* ── Bottom ── */
        .bottom { width: 100%; display: flex; flex-direction: column; gap: 12px; }

        .odds-row { width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .odds-header {
            display: flex; justify-content: space-between;
            font-size: 0.65rem; letter-spacing: 2px;
            text-transform: uppercase; color: var(--dim);
        }
        .odds-val {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.82rem; color: var(--text);
        }
        .odds-track {
            width: 100%; height: 5px;
            background: rgba(255,255,255,0.04);
            border-radius: 99px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .odds-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--gold) 65%, var(--red));
            border-radius: 99px;
            transition: width 0.45s cubic-bezier(0.4,0,0.2,1);
            width: 83.33%;
        }

        .stats { display: flex; gap: 9px; justify-content: center; }
        .stat-pill {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 6px 15px;
            display: flex; align-items: center; gap: 6px;
            font-size: 0.72rem; color: var(--dim);
        }
        .sval {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem; letter-spacing: 1px;
            color: var(--text);
        }

        .history { display: flex; gap: 5px; justify-content: center; min-height: 11px; }
        .hdot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--border2);
        }
        .hdot.s { background: var(--green); box-shadow: 0 0 5px rgba(46,204,113,0.6); }
        .hdot.d { background: var(--red);   box-shadow: 0 0 5px rgba(231,76,60,0.6); }
        .hdot.new { animation: pop 0.22s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="bloodOverlay"></div>
<div id="flashOverlay"></div>

<div class="wrapper">

    <div style="text-align:center; margin-bottom:2px">
        <div class="title">RUSSIAN ROULETTE</div>
        <div class="tagline">How lucky are you?</div>
    </div>

    <!-- ══ GUN SCENE ══ -->
    <div class="gun-scene">
        <div class="gun-wrap" id="gunWrap">
            <div class="muzzle" id="muzzle"></div>
            <div class="smoke-puff" id="smoke"></div>

            <!--
                Proper side-view revolver SVG.
                ViewBox: 0 0 380 140
                Oriented: barrel points RIGHT, grip hangs DOWN-LEFT.
                Major parts: barrel, frame, cylinder (side view circle), grip, hammer, trigger.
            -->
            <svg class="gun-svg" viewBox="0 0 380 140" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Steel gradient for large surfaces -->
                <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#3a5060"/>
                  <stop offset="40%"  stop-color="#253545"/>
                  <stop offset="100%" stop-color="#111d28"/>
                </linearGradient>
                <!-- Darker steel for underside / shadows -->
                <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#1e2e3e"/>
                  <stop offset="100%" stop-color="#0b1420"/>
                </linearGradient>
                <!-- Barrel top highlight -->
                <linearGradient id="gBarrelTop" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#4a6278"/>
                  <stop offset="100%" stop-color="#2a3e52"/>
                </linearGradient>
                <!-- Cylinder side radial -->
                <radialGradient id="gCylSide" cx="40%" cy="35%" r="65%">
                  <stop offset="0%"   stop-color="#3a5468"/>
                  <stop offset="100%" stop-color="#0e1c28"/>
                </radialGradient>
                <!-- Grip wood -->
                <linearGradient id="gGrip" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%"   stop-color="#2a1f14"/>
                  <stop offset="50%"  stop-color="#1e1610"/>
                  <stop offset="100%" stop-color="#110e08"/>
                </linearGradient>
                <!-- Grip highlight -->
                <linearGradient id="gGripHi" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%"   stop-color="rgba(255,200,120,0.08)"/>
                  <stop offset="100%" stop-color="rgba(255,200,120,0)"/>
                </linearGradient>
                <!-- Hammer -->
                <linearGradient id="gHammer" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#3d5568"/>
                  <stop offset="100%" stop-color="#162030"/>
                </linearGradient>
                <!-- Bore -->
                <radialGradient id="gBore" cx="45%" cy="40%" r="60%">
                  <stop offset="0%"   stop-color="#1a2a38"/>
                  <stop offset="100%" stop-color="#030608"/>
                </radialGradient>
              </defs>

              <!-- ════════════════════════════════
                   1. BARREL  (pointing right)
                   Top edge: y=44, bottom: y=68, length ~220px
                   ════════════════════════════════ -->
              <!-- Main barrel body -->
              <rect x="118" y="44" width="222" height="24" rx="4" fill="url(#gSteel)"/>
              <!-- Top rib (raised sight rib running barrel length) -->
              <rect x="120" y="44" width="218" height="5" rx="2" fill="url(#gBarrelTop)"/>
              <!-- Barrel underside lug -->
              <rect x="130" y="63" width="160" height="8" rx="3" fill="url(#gDark)"/>
              <!-- Extractor rod housing (below barrel) -->
              <rect x="136" y="68" width="140" height="7" rx="3" fill="url(#gDark)"/>
              <!-- Muzzle end cap -->
              <rect x="332" y="40" width="12" height="32" rx="4" fill="#1a2a38"/>
              <rect x="333" y="41" width="10" height="7"  rx="2" fill="#243444"/>
              <!-- Muzzle bore opening -->
              <circle cx="338" cy="56" r="8"   fill="url(#gBore)" stroke="#111d28" stroke-width="1.5"/>
              <circle cx="338" cy="56" r="4.5" fill="#050a0e"/>
              <circle cx="336" cy="54" r="1.2" fill="rgba(255,255,255,0.06)"/>

              <!-- ════════════════════════════════
                   2. FRAME (main receiver body)
                   Connects barrel to grip
                   ════════════════════════════════ -->
              <!-- Top-frame / receiver behind cylinder -->
              <path d="
                M118 44
                L118 68
                L 98 80
                L 88 90
                L 88 68
                Q 88 48 100 44
                Z
              " fill="url(#gSteel)"/>
              <!-- Front strap (connects barrel floor to trigger guard) -->
              <path d="
                M118 68
                L118 92
                L108 98
                L 98 98
                L 92 90
                L 88 80
                L 98 80
                L118 68
                Z
              " fill="url(#gDark)"/>
              <!-- Backstrap (rear of frame above grip) -->
              <path d="
                M88 68
                L88 44
                L100 44
                L100 68
                Z
              " fill="url(#gSteel)"/>

              <!-- ════════════════════════════════
                   3. CYLINDER SIDE VIEW
                   Circle at cx=148, cy=56 r=28
                   (sits in the frame window)
                   ════════════════════════════════ -->
              <!-- Cylinder shadow ring -->
              <circle cx="148" cy="56" r="30" fill="rgba(0,0,0,0.5)"/>
              <!-- Cylinder body -->
              <circle cx="148" cy="56" r="28" fill="url(#gCylSide)" stroke="#1a2838" stroke-width="2"/>
              <!-- Cylinder front face rim -->
              <circle cx="148" cy="56" r="28" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
              <!-- Flute lines (6 flutes on cylinder surface) -->
              <g stroke="#0e1c28" stroke-width="1.8" opacity="0.8">
                <line x1="148" y1="28" x2="148" y2="84"/>
                <line x1="120.7" y1="40" x2="175.3" y2="72"/>
                <line x1="120.7" y1="72" x2="175.3" y2="40"/>
              </g>
              <!-- Cylinder center pin -->
              <circle cx="148" cy="56" r="6"   fill="#1a2838" stroke="#0e1c28" stroke-width="1.5"/>
              <circle cx="148" cy="56" r="3.5" fill="#0a1420"/>
              <circle cx="147" cy="55" r="1"   fill="rgba(255,255,255,0.08)"/>
              <!-- Ejector rod (thin rod below barrel connecting to cylinder) -->
              <rect x="120" y="71" width="44" height="3" rx="1.5" fill="#1a2838"/>

              <!-- ════════════════════════════════
                   4. HAMMER
                   ════════════════════════════════ -->
              <!-- Hammer body (sits at top-rear of frame) -->
              <path d="
                M88 44
                L88 60
                L82 62
                L78 56
                L78 44
                Q80 38 84 38
                L88 44
                Z
              " fill="url(#gHammer)"/>
              <!-- Hammer spur (serrated top) -->
              <path d="
                M78 44
                L78 36
                Q80 30 86 30
                L90 30
                L90 42
                L88 44
                Z
              " fill="url(#gHammer)"/>
              <!-- Hammer spur serrations -->
              <line x1="80" y1="30" x2="80" y2="42" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
              <line x1="83" y1="30" x2="83" y2="42" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
              <line x1="86" y1="30" x2="86" y2="42" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
              <line x1="89" y1="30" x2="89" y2="42" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
              <!-- Hammer highlight -->
              <line x1="88" y1="38" x2="88" y2="62" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

              <!-- ════════════════════════════════
                   5. GRIP
                   Angled downward from frame
                   ════════════════════════════════ -->
              <!-- Grip frame (metal backstrap) -->
              <path d="
                M88 90
                L84 130
                Q83 138 90 138
                L110 138
                Q118 138 118 130
                L118 98
                Z
              " fill="url(#gGrip)"/>
              <!-- Grip panel overlay (wood grain illusion) -->
              <path d="
                M90 92
                L86 130
                Q86 136 91 136
                L108 136
                Q115 136 115 130
                L115 100
                Z
              " fill="url(#gGripHi)"/>
              <!-- Grip checkering lines (horizontal) -->
              <g stroke="rgba(0,0,0,0.35)" stroke-width="1.1">
                <line x1="87" y1="100" x2="116" y2="100"/>
                <line x1="86" y1="108" x2="116" y2="108"/>
                <line x1="85" y1="116" x2="116" y2="116"/>
                <line x1="84" y1="124" x2="115" y2="124"/>
                <line x1="84" y1="132" x2="113" y2="132"/>
              </g>
              <!-- Grip screw -->
              <circle cx="102" cy="114" r="4"   fill="#1a2838" stroke="#0e1c28" stroke-width="1"/>
              <line   x1="99"  y1="114" x2="105" y2="114" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
              <line   x1="102" y1="111" x2="102" y2="117" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

              <!-- ════════════════════════════════
                   6. TRIGGER GUARD + TRIGGER
                   ════════════════════════════════ -->
              <!-- Trigger guard bow -->
              <path d="
                M98 98
                Q96 114 102 120
                Q110 126 118 120
                L118 98
              " fill="none" stroke="#253545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Trigger guard fill -->
              <path d="
                M98 98
                Q96 114 102 120
                Q110 126 118 120
                L118 98
              " fill="none" stroke="#1a2838" stroke-width="2"/>
              <!-- Trigger (gold/brass) -->
              <path d="
                M106 98
                L103 116
              " stroke="#c8922a" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Trigger highlight -->
              <path d="
                M106 98
                L103 116
              " stroke="rgba(255,210,80,0.25)" stroke-width="1.5" stroke-linecap="round"/>

              <!-- ════════════════════════════════
                   7. FRAME SIDE PANEL details
                   ════════════════════════════════ -->
              <!-- Frame window opening (where cylinder sits) -->
              <ellipse cx="148" cy="56" rx="30" ry="30" fill="none" stroke="#0e1c28" stroke-width="3"/>
              <!-- Loading gate (small door on right side, behind cylinder) -->
              <path d="M175 50 L182 50 L182 62 L175 62 Z" fill="#1e3044" stroke="#0e1c28" stroke-width="1" rx="1"/>
              <line x1="178" y1="50" x2="178" y2="62" stroke="#253a50" stroke-width="1"/>

              <!-- ════════════════════════════════
                   8. SIGHTS
                   ════════════════════════════════ -->
              <!-- Rear sight (at top of frame above cylinder) -->
              <rect x="86" y="38" width="14" height="6" rx="2" fill="#1e3044"/>
              <rect x="90" y="39" width="4"  height="3" rx="1" fill="#0a1420"/>
              <!-- Front sight (at muzzle end) -->
              <rect x="326" y="38" width="6"  height="8" rx="1.5" fill="#1e3044"/>
              <!-- Red front sight dot -->
              <circle cx="329" cy="40" r="1.5" fill="#e74c3c" opacity="0.85"/>

              <!-- ════════════════════════════════
                   9. SUBTLE SURFACE HIGHLIGHTS
                   ════════════════════════════════ -->
              <!-- Barrel top edge shine -->
              <line x1="122" y1="45" x2="330" y2="45" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" stroke-linecap="round"/>
              <!-- Frame side upper edge -->
              <line x1="100" y1="44" x2="118" y2="44" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            </svg>
        </div>
    </div>

    <!-- ══ GAME CARD ══ -->
    <div class="card" id="card">

        <!-- SVG Cylinder — chambers drawn with JS at exact circle positions -->
        <div class="cyl-wrap">
            <div class="cyl-pointer"></div>
            <svg id="cylSvg" viewBox="-85 -85 170 170">
                <defs>
                    <radialGradient id="cGrad" cx="38%" cy="32%" r="65%">
                        <stop offset="0%"   stop-color="#2e4558"/>
                        <stop offset="100%" stop-color="#0b1520"/>
                    </radialGradient>
                    <radialGradient id="cInner" cx="40%" cy="35%" r="60%">
                        <stop offset="0%"   stop-color="#1e3040"/>
                        <stop offset="100%" stop-color="#080e16"/>
                    </radialGradient>
                    <radialGradient id="cPin" cx="38%" cy="33%" r="65%">
                        <stop offset="0%"   stop-color="#38526a"/>
                        <stop offset="100%" stop-color="#0a1420"/>
                    </radialGradient>
                    <!-- empty chamber -->
                    <radialGradient id="chEmpty" cx="38%" cy="32%" r="60%">
                        <stop offset="0%"   stop-color="#0e1c2a"/>
                        <stop offset="100%" stop-color="#030609"/>
                    </radialGradient>
                    <!-- bullet chamber -->
                    <radialGradient id="chBullet" cx="35%" cy="28%" r="65%">
                        <stop offset="0%"   stop-color="#ffe090"/>
                        <stop offset="30%"  stop-color="#d08020"/>
                        <stop offset="65%"  stop-color="#b03020"/>
                        <stop offset="100%" stop-color="#4a0808"/>
                    </radialGradient>
                    <filter id="chamberShadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.8)"/>
                    </filter>
                    <filter id="bulletGlow">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>

                <!-- Outer rim shadow -->
                <circle r="82" fill="rgba(0,0,0,0.55)"/>
                <!-- Cylinder body -->
                <circle r="80" fill="url(#cGrad)" stroke="#14202e" stroke-width="3"/>
                <!-- Inner face -->
                <circle r="72" fill="url(#cInner)"/>
                <!-- Flute grooves (6 segments) -->
                <g stroke="#0a1520" stroke-width="2" opacity="0.7">
                    <line x1="0" y1="-80" x2="0" y2="80"/>
                    <line x1="-69.3" y1="-40" x2="69.3" y2="40"/>
                    <line x1="-69.3" y1="40"  x2="69.3" y2="-40"/>
                </g>
                <!-- Rim highlight -->
                <circle r="80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

                <!-- 6 chambers — drawn by JS below -->
                <g id="chamberGroup"></g>

                <!-- Center pin -->
                <circle r="10" fill="url(#cPin)" stroke="#0a1420" stroke-width="1.5"/>
                <circle r="6"  fill="#060e18"/>
                <circle r="2"  cx="-1.5" cy="-1.5" fill="rgba(255,255,255,0.08)"/>

                <!-- Rotation group — JS animates transform on this -->
                <!-- (chambers are children of chamberGroup which is inside cylSvg; we rotate cylSvg) -->
            </svg>
        </div>

        <div class="divider"></div>

        <div class="status idle" id="statusEl">SPIN TO BEGIN</div>

        <div class="btn-group">
            <button class="btn btn-spin"  id="spinBtn">⟳  SPIN</button>
            <button class="btn btn-shoot" id="shootBtn" disabled>FIRE  🔫</button>
        </div>

        <div class="divider"></div>

        <div class="bottom">
            <div class="odds-row">
                <div class="odds-header">
                    <span>Survival Odds</span>
                    <span class="odds-val" id="oddsVal">5 in 6</span>
                </div>
                <div class="odds-track">
                    <div class="odds-fill" id="oddsFill"></div>
                </div>
            </div>
            <div class="stats">
                <div class="stat-pill">💀 <span class="sval" id="svCount">0</span></div>
                <div class="stat-pill">🔄 <span class="sval" id="spCount">0</span></div>
                <div class="stat-pill">🔥 <span class="sval" id="stCount">0</span></div>
            </div>
            <div class="history" id="history"></div>
        </div>
    </div>

</div>

<script>
/* ══════════════════════════════════════════════════════
   BUILD SVG CYLINDER CHAMBERS
   6 chambers on a circle of radius 46, starting at top (−90°)
   spacing 60° each
══════════════════════════════════════════════════════ */
const CYL_R = 46;      // orbit radius
const CH_R  = 15;      // chamber hole radius
const chamberGroup = document.getElementById('chamberGroup');
const chamberEls = [];

for (let i = 0; i < 6; i++) {
    const angleDeg = -90 + i * 60;          // start at top
    const a = angleDeg * Math.PI / 180;
    const cx = CYL_R * Math.cos(a);
    const cy = CYL_R * Math.sin(a);

    // Outer ring
    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx', cx.toFixed(2));
    ring.setAttribute('cy', cy.toFixed(2));
    ring.setAttribute('r', (CH_R + 3).toFixed(2));
    ring.setAttribute('fill', '#0e1a26');
    ring.setAttribute('stroke', '#192838');
    ring.setAttribute('stroke-width', '1.5');
    chamberGroup.appendChild(ring);

    // Chamber bore
    const hole = document.createElementNS('http://www.w3.org/2000/svg','circle');
    hole.setAttribute('cx', cx.toFixed(2));
    hole.setAttribute('cy', cy.toFixed(2));
    hole.setAttribute('r', CH_R.toFixed(2));
    hole.setAttribute('fill', 'url(#chEmpty)');
    hole.setAttribute('filter', 'url(#chamberShadow)');
    chamberGroup.appendChild(hole);

    // Inner depth dot
    const depth = document.createElementNS('http://www.w3.org/2000/svg','circle');
    depth.setAttribute('cx', (cx - 1.5).toFixed(2));
    depth.setAttribute('cy', (cy - 1.5).toFixed(2));
    depth.setAttribute('r', '4');
    depth.setAttribute('fill', 'rgba(0,0,0,0.5)');
    chamberGroup.appendChild(depth);

    chamberEls.push({ hole, ring, depth, cx, cy });
}

function setChambers(bulletPos, reveal) {
    chamberEls.forEach(({ hole, ring }, i) => {
        if (reveal && i === bulletPos) {
            hole.setAttribute('fill', 'url(#chBullet)');
            hole.setAttribute('filter', 'url(#bulletGlow)');
            ring.setAttribute('stroke', '#8b2020');
        } else {
            hole.setAttribute('fill', 'url(#chEmpty)');
            hole.setAttribute('filter', 'url(#chamberShadow)');
            ring.setAttribute('stroke', '#192838');
        }
    });
}

/* ══════════════════════════════════════════════════════
   CYLINDER ROTATION — animate SVG transform directly
══════════════════════════════════════════════════════ */
const cylSvg = document.getElementById('cylSvg');
let currentRot = 0;

function setCylRotation(deg, animated, duration = 1200, easing = 'cubic-bezier(0.15,0.85,0.35,1)') {
    if (animated) {
        cylSvg.style.transition = `transform ${duration}ms ${easing}`;
    } else {
        cylSvg.style.transition = 'none';
    }
    cylSvg.style.transform = `rotate(${deg}deg)`;
}

/* ══════════════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════════════ */
const AC = new (window.AudioContext || window.webkitAudioContext)();
const resume = () => { if(AC.state==='suspended') AC.resume(); };

function playRatchet() {
    resume();
    const t=AC.currentTime;
    const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(1400+Math.random()*200,t); o.frequency.exponentialRampToValueAtTime(350,t+0.025);
    f.type='bandpass'; f.frequency.value=2200; f.Q.value=5;
    g.gain.setValueAtTime(0.25,t); g.gain.linearRampToValueAtTime(0.001,t+0.025);
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.025);
}
function playThud() {
    resume();
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(48,t+0.09);
    g.gain.setValueAtTime(0.5,t); g.gain.linearRampToValueAtTime(0.001,t+0.09);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.09);
}
function playTrigger() {
    resume();
    const t=AC.currentTime;
    [[1800,400,0.04,'sine',0,0.38],[140,38,0.07,'triangle',0.03,0.48]].forEach(([f1,f2,d,tp,dl,v])=>{
        const o=AC.createOscillator(), g=AC.createGain();
        o.type=tp; o.frequency.setValueAtTime(f1,t+dl); o.frequency.exponentialRampToValueAtTime(f2,t+dl+d);
        g.gain.setValueAtTime(v,t+dl); g.gain.linearRampToValueAtTime(0.001,t+dl+d);
        o.connect(g); g.connect(AC.destination); o.start(t+dl); o.stop(t+dl+d);
    });
}
function playEmptyClick() {
    resume();
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(220,t+0.06);
    g.gain.setValueAtTime(0.16,t); g.gain.linearRampToValueAtTime(0.001,t+0.06);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.06);
}
function playBang() {
    resume();
    const t=AC.currentTime, dur=2.0;
    const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const ns=AC.createBufferSource(); ns.buffer=buf;
    const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(1100,t); fl.frequency.exponentialRampToValueAtTime(55,t+dur);
    const gn=AC.createGain(); gn.gain.setValueAtTime(1.0,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    ns.connect(fl); fl.connect(gn); gn.connect(AC.destination); ns.start(t);
    const sb=AC.createOscillator(), sg=AC.createGain();
    sb.type='sine'; sb.frequency.setValueAtTime(110,t); sb.frequency.exponentialRampToValueAtTime(28,t+0.35);
    sg.gain.setValueAtTime(1.0,t); sg.gain.linearRampToValueAtTime(0.001,t+0.35);
    sb.connect(sg); sg.connect(AC.destination); sb.start(t); sb.stop(t+0.35);
}

/* ══════════════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════════════ */
const cv=document.getElementById('particles'), cx2=cv.getContext('2d');
let W, H;
const resize=()=>{ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; };
resize(); window.addEventListener('resize', resize);

const allP=[];
class Particle {
    constructor(x,y,col) {
        this.x=x; this.y=y; this.col=col;
        this.vx=(Math.random()-.5)*7; this.vy=(Math.random()-1.1)*8;
        this.r=Math.random()*4+1.5; this.life=1;
    }
    step(){ this.vx*=0.97; this.vy+=0.16; this.x+=this.vx; this.y+=this.vy; this.life-=0.02; }
    draw(){
        cx2.save(); cx2.globalAlpha=Math.max(0,this.life);
        cx2.shadowColor=this.col; cx2.shadowBlur=7; cx2.fillStyle=this.col;
        cx2.beginPath(); cx2.arc(this.x,this.y,this.r,0,Math.PI*2); cx2.fill(); cx2.restore();
    }
}
function burst(x,y,col,n=35){ for(let i=0;i<n;i++) allP.push(new Particle(x,y,col)); }

const embers=Array.from({length:22},()=>{
    const e={reset(){
        this.x=Math.random()*window.innerWidth; this.y=window.innerHeight+8;
        this.r=Math.random()*1.6+0.3; this.vx=(Math.random()-.5)*.4; this.vy=-(Math.random()*.5+.2);
        this.alpha=Math.random()*.3+.07; this.life=1;
    }}; e.reset(); e.y=Math.random()*window.innerHeight; return e;
});

(function loop(){
    cx2.clearRect(0,0,W,H);
    for(let i=allP.length-1;i>=0;i--){ allP[i].step(); allP[i].draw(); if(allP[i].life<=0) allP.splice(i,1); }
    for(const e of embers){
        e.x+=e.vx; e.y+=e.vy; e.life-=0.0025;
        cx2.save(); cx2.globalAlpha=e.alpha*e.life;
        cx2.fillStyle='#e74c3c'; cx2.shadowColor='#e74c3c'; cx2.shadowBlur=5;
        cx2.beginPath(); cx2.arc(e.x,e.y,e.r,0,Math.PI*2); cx2.fill(); cx2.restore();
        if(e.life<=0) e.reset();
    }
    requestAnimationFrame(loop);
})();

/* ══════════════════════════════════════════════════════
   DOM refs & State
══════════════════════════════════════════════════════ */
const gunWrap  = document.getElementById('gunWrap');
const muzzle   = document.getElementById('muzzle');
const smoke    = document.getElementById('smoke');
const spinBtn  = document.getElementById('spinBtn');
const shootBtn = document.getElementById('shootBtn');
const statusEl = document.getElementById('statusEl');
const svCountEl= document.getElementById('svCount');
const spCountEl= document.getElementById('spCount');
const stCountEl= document.getElementById('stCount');
const oddsFill = document.getElementById('oddsFill');
const oddsVal  = document.getElementById('oddsVal');
const historyEl= document.getElementById('history');
const card     = document.getElementById('card');
const bloodOv  = document.getElementById('bloodOverlay');
const flashOv  = document.getElementById('flashOverlay');

let bulletPos=Math.floor(Math.random()*6), currentPos=0;
let isSpun=false, survives=0, spins=0, streak=0, histArr=[];

function setStatus(t,c='')  { statusEl.textContent=t; statusEl.className='status '+c; }
function setOdds(n,d)       { oddsFill.style.width=((n/d)*100)+'%'; oddsVal.textContent=n+' in '+d; }

function addDot(s) {
    histArr.push(s); if(histArr.length>14) histArr.shift();
    historyEl.innerHTML='';
    histArr.forEach((v,i)=>{
        const d=document.createElement('div');
        d.className='hdot '+(v?'s':'d')+(i===histArr.length-1?' new':'');
        historyEl.appendChild(d);
    });
}

function screenFlash() {
    flashOv.style.opacity='0.9';
    setTimeout(()=>{ flashOv.style.opacity='0'; },70);
}

function triggerMuzzle() {
    muzzle.classList.remove('bang'); void muzzle.offsetWidth; muzzle.classList.add('bang');
    setTimeout(()=>{ smoke.classList.remove('puff'); void smoke.offsetWidth; smoke.classList.add('puff'); },90);
}

function animGun(type) {
    gunWrap.classList.remove('recoil','dryfire'); void gunWrap.offsetWidth;
    gunWrap.classList.add(type);
    setTimeout(()=>gunWrap.classList.remove(type), type==='recoil' ? 380 : 220);
}

/* ══════════════════════════════════════════════════════
   SPIN
══════════════════════════════════════════════════════ */
spinBtn.addEventListener('click', ()=>{
    if(spinBtn.disabled) return;
    spinBtn.disabled=true; shootBtn.disabled=true;
    bloodOv.classList.remove('active');
    setStatus('SPINNING...','');
    setChambers(-1, false);

    bulletPos = Math.floor(Math.random()*6);

    const extra = (Math.floor(Math.random()*3)+3)*360;
    const off   = Math.floor(Math.random()*6)*60;
    const target = currentRot + extra + off;

    setCylRotation(target, true, 1200);

    // ratchet clicks
    const t0=performance.now(); let cl=0;
    (function tick(ts){
        const p=Math.min((ts-t0)/1200,1);
        if(cl<20&&p<1){ playRatchet(); cl++; setTimeout(()=>requestAnimationFrame(tick),18+p*p*150); }
    })(performance.now());

    setTimeout(()=>{
        playThud();
        currentRot = target;
        currentPos = Math.round((360-(currentRot%360))%360/60)%6;
        isSpun=true;
        spinBtn.disabled=false; shootBtn.disabled=false;
        setStatus('PULL THE TRIGGER','');
        spins++; spCountEl.textContent=spins;
        setOdds(5,6);
    }, 1200);
});

/* ══════════════════════════════════════════════════════
   SHOOT
══════════════════════════════════════════════════════ */
shootBtn.addEventListener('click', ()=>{
    if(!isSpun||shootBtn.disabled) return;
    spinBtn.disabled=true; shootBtn.disabled=true;
    setStatus('...','');
    playTrigger();

    setTimeout(()=>{
        if(currentPos === bulletPos) {
            /* ── BANG ── */
            playBang(); screenFlash(); animGun('recoil'); triggerMuzzle();
            setTimeout(()=>{ bloodOv.classList.add('active'); },55);
            card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'),500);
            setChambers(bulletPos, true);
            setStatus('BANG','danger');
            burst(W/2,H/2,'#c0392b',85); burst(W/2,H/2,'#e74c3c',50); burst(W/2,H/2,'#ff7070',20);
            addDot(false);
            streak=0; stCountEl.textContent=streak;
            svCountEl.textContent=survives;
            isSpun=false; spinBtn.disabled=false;
            spinBtn.textContent='⟳  TRY AGAIN';
            setOdds(0,1);
        } else {
            /* ── CLICK (empty) ── */
            playEmptyClick(); animGun('dryfire');
            // NO muzzle flash — chamber is empty
            card.classList.add('sglow'); setTimeout(()=>card.classList.remove('sglow'),900);
            setStatus('CLICK — SURVIVED','safe');
            const r=card.getBoundingClientRect();
            burst(r.left+r.width/2,r.top+80,'#2ecc71',28); burst(r.left+r.width/2,r.top+80,'#27ae60',18);
            survives++; streak++;
            svCountEl.textContent=survives; stCountEl.textContent=streak;
            addDot(true);
            isSpun=false;
            currentPos=(currentPos+1)%6;
            currentRot += 60;
            setCylRotation(currentRot, true, 280, 'ease-out');
            playThud();
            spinBtn.disabled=false; shootBtn.disabled=true;
            spinBtn.textContent='⟳  SPIN';
            setOdds(4,5);
        }
    },500);
});

setOdds(5,6);
</script>
</body>
</html>
